<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ADA-121</title><style>body{background:#09121c;color:#d9eeed;font:16px monospace;max-width:850px;margin:40px auto;padding:16px}h1{color:#ffc07a}pre{background:#122732;color:#81e8cf;padding:22px}button,select{padding:10px;font:inherit}</style><h1>ADA-121 · A.I.O.N. confidence</h1><p>One Hegemon · (inf) - + [inf] · PB208 · .dlw</p><select id="p"><option>.08</option><option>.25</option><option>.45</option></select> <button id="next">Advance</button><pre id="out"></pre><script type="module">// ADA-121 .dlw — causal two-tick forecast calibration.
export function world(seed,p=.08){let x=seed>>>0,q=0,d=1;const a=[q];for(let t=1;t<208;t++){x=(Math.imul(x,1664525)+1013904223)>>>0;if(x/4294967296<p)d=-d;q=(q+d+26)%26;a.push(q);}return a;}
export function forecast(q,d,p){const a=Array(26).fill(0);for(const [offset,w] of [[2*d,(1-p)**2],[-2*d,p*(1-p)],[0,p]])a[(q+offset+26)%26]+=w;return a;}
export function calibrate(){let flips=0,total=0;for(let s=1000;s<1064;s++){const a=world(s);let last=1;for(let t=1;t<a.length;t++){const d=(a[t]-a[t-1]+26)%26===1?1:-1;flips+=Number(d!==last);total++;last=d;}}return {flips,total,p:(flips+1)/(total+2)};}
export function run(seed,p=.08,cal=calibrate().p){const a=world(seed,p),ledger=[],stats={n:0,hit:0,accepted:0,acceptedHit:0,brierFixed:0,brierAdaptive:0,brierPoint:0};let flips=0,n=0,last=1;for(let t=1;t<a.length;t++){const d=(a[t]-a[t-1]+26)%26===1?1:-1;flips+=Number(d!==last);n++;last=d;const rate=(20*cal+flips)/(20+n),fixed=forecast(a[t],d,cal),adaptive=forecast(a[t],d,rate),point=forecast(a[t],d,0);const best=adaptive.indexOf(Math.max(...adaptive));const r=Object.freeze({issued:t,target:t+2,rate,best,confidence:adaptive[best],fixed,adaptive,point});ledger.push(r);if(t>=3){const f=ledger[t-3],actual=a[t];stats.n++;stats.hit+=Number(f.best===actual);if(f.confidence>=.8){stats.accepted++;stats.acceptedHit+=Number(f.best===actual);}for(const [k,v] of [["brierFixed",f.fixed],["brierAdaptive",f.adaptive],["brierPoint",f.point]])stats[k]+=v.reduce((s,x,i)=>s+(x-Number(i===actual))**2,0);}}return {seed,p,stats,ledger};}
export function test(){const cal=calibrate(),groups=[];for(const p of [.08,.25,.45]){const cases=Array.from({length:64},(_,i)=>run(2000+i,p,cal.p));const total=Object.fromEntries(Object.keys(cases[0].stats).map(k=>[k,cases.reduce((s,r)=>s+r.stats[k],0)]));for(const r of cases)if(r.stats.n!==205||r.ledger.some(f=>f.target-f.issued!==2||Math.abs(f.adaptive.reduce((a,b)=>a+b,0)-1)>1e-10))throw Error("invariant");groups.push({p,total});}return {cal,groups,fixture:run(2000,.25,cal.p)};}

let t=0,r=run(2000);const e=id=>document.getElementById(id);function draw(){const f=r.ledger[t];e("out").textContent="Issued "+f.issued+" | target "+f.target+"\nDirection reversal estimate "+f.rate.toFixed(3)+"\nPrediction "+String.fromCharCode(65+f.best)+" | confidence "+f.confidence.toFixed(3)+"\n"+(f.confidence>=.8?"ACCEPT":"HOLD");}e("next").onclick=()=>{t=Math.min(t+1,r.ledger.length-1);draw()};e("p").onchange=()=>{t=0;r=run(2000,Number(e("p").value));draw()};draw();</script>
