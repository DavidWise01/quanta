name: QG-068 Hive Revocation Floor Tests
on:
  push:
    paths:
      - "language/hive-revocation-floor.mjs"
      - "tests/hive-revocation-floor.test.mjs"
      - ".github/workflows/hive-revocation-floor-tests.yml"
  pull_request:
    paths:
      - "language/hive-revocation-floor.mjs"
      - "tests/hive-revocation-floor.test.mjs"
      - ".github/workflows/hive-revocation-floor-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/revocation-outlives-recovery.test.mjs tests/hive-revocation-floor.test.mjs
