<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ADA-117B</title><style>body{background:#09121c;color:#d9eeed;font:16px monospace;max-width:850px;margin:40px auto;padding:16px}h1{color:#ffc07a}pre{background:#122732;color:#81e8cf;padding:22px;line-height:1.8}button{padding:10px;font:inherit}a{color:#81e8cf}</style><h1>ADA-117B · Diodic PB</h1><p>inf - + inf → (inf) - + [inf] · .dlw</p><pre>{brace,abc[box,bca(torroid,cab)]}</pre><button id="next">Advance 1″</button> <button id="replay">Replay</button> <button id="gap">Skip 1″</button> <button id="reset">Reset</button><pre id="view"></pre><p>One Hegemon; 208 symbolic Pb anchor. Integer phase clock, not physical Planck time. Witness count is a simulated admission flag, not independent evidence.</p><a href="../living-116/diodic-pb-117a.md">Lineage</a><script type="module">// ADA-117B .dlw — one Hegemon, nine observations, one diodic event ledger.
export const TURN=1296000n;
export function clock(t){t=BigInt(t);if(t<0n)throw Error("negative tick");const p=t%TURN;return {tick:String(t),revolution:String(t/TURN),degree:Number(p/3600n),minute:Number(p%3600n/60n),arcsecond:Number(p%60n),orientation:["abc","bca","cab"][Number(p/432000n)]};}
export function admit(state,event){const t=BigInt(event.tick),last=BigInt(state.head);if(!Number.isInteger(event.node)||event.node<0||event.node>8)return "invalid";if(t<=last)return "stale";if(t!==last+1n)return "gap";if(event.witnesses!==9)return "hold";state.ledger.push({node:event.node,...clock(t)});state.head=String(t);return "accept";}
export function test(){const boundaries=[432000n,864000n,1296000n,2592000n,9007199254740993n*TURN];let checks=0;const cases=[];for(const b of boundaries){const state={head:String(b-3n),ledger:[]};const rows=[];const events=[[b-2n,9,"accept"],[b,9,"gap"],[b-2n,9,"stale"],[b-1n,8,"hold"],[b-1n,9,"accept"],[b,9,"accept"],[b-1n,9,"stale"],[b+1n,9,"accept"]];for(const [t,w,expected] of events){const before=JSON.stringify(state),got=admit(state,{tick:String(t),node:Number(t%9n),witnesses:w});if(got!==expected||(got!=="accept"&&before!==JSON.stringify(state)))throw Error("admission");checks++;rows.push({tick:String(t),expected,got});}if(state.ledger.length!==4||state.head!==String(b+1n))throw Error("ledger");checks++;cases.push({boundary:String(b),rows,ledger:state.ledger});}let rotations=0;for(let t=0n;t<TURN;t++){const c=clock(t);if(BigInt(c.degree*3600+c.minute*60+c.arcsecond)!==t)throw Error("phase");rotations++;}return {checks,rotations,cases};}

let s={head:"1295997",ledger:[]};const el=id=>document.getElementById(id);function show(status){const c=clock(s.head);el("view").textContent="STATUS "+status+"\n"+JSON.stringify(c,null,2)+"\nAccepted events "+s.ledger.length;}function go(delta){show(admit(s,{tick:String(BigInt(s.head)+delta),node:0,witnesses:9}));}el("next").onclick=()=>go(1n);el("replay").onclick=()=>go(0n);el("gap").onclick=()=>go(2n);el("reset").onclick=()=>{s={head:"1295997",ledger:[]};show("reset")};show("ready");</script>
