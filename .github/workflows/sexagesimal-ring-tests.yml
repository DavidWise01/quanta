name: QG-025 Base-60 transport tests
on:
  push:
    paths:
      - 'language/sexagesimal-ring.mjs'
      - 'tests/sexagesimal-ring.test.mjs'
      - '.github/workflows/sexagesimal-ring-tests.yml'
  pull_request:
    paths:
      - 'language/sexagesimal-ring.mjs'
      - 'tests/sexagesimal-ring.test.mjs'
      - '.github/workflows/sexagesimal-ring-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sexagesimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sexagesimal-ring.test.mjs
