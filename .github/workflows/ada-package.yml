name: ADA reproducible WASM package
on:
  push:
    paths:
      - 'ada/wasm/**'
      - 'ada/rust/**'
      - '.github/workflows/ada-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: '--remap-path-prefix=/home/runner/work/quanta/quanta=/source'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.85.1 test --manifest-path ada/rust/Cargo.toml
      - run: cargo +1.85.1 test --locked --manifest-path ada/wasm/Cargo.toml
      - name: Double clean compilation
        run: |
          for dir in build-a build-b; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/$dir" cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown --manifest-path ada/wasm/Cargo.toml --lib
          done
          cmp "$RUNNER_TEMP/build-a/wasm32-unknown-unknown/release/ada_browser.wasm" "$RUNNER_TEMP/build-b/wasm32-unknown-unknown/release/ada_browser.wasm"
      - name: Verify native parity and package
        run: |
          mkdir -p package
          cp "$RUNNER_TEMP/build-a/wasm32-unknown-unknown/release/ada_browser.wasm" package/
          cargo +1.85.1 run --locked --quiet --release --manifest-path ada/wasm/Cargo.toml --bin parity > native.tsv
          node ada/wasm/reference-schema.test.mjs > package/reference-schema.json
          node ada/wasm/parity-strict.mjs package/ada_browser.wasm native.tsv > package/parity.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path("package/ada_browser.wasm")
          receipt={"schema":"ADA-281N.package.v1","source_commit":os.environ["GITHUB_SHA"],"toolchain":subprocess.check_output(["rustc","+1.85.1","-Vv"],text=True),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size,"double_build_equal":True,"parity":json.loads(pathlib.Path("package/parity.json").read_text()),"authority":"OBSERVE_ONLY","watermark":".dlw"}
          pathlib.Path("package/manifest.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Chromium acceptance against staged package
        run: |
          mkdir -p ada/wasm/package
          cp package/* ada/wasm/package/
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ada-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ada/wasm/package/manifest.json >/dev/null && break; sleep 1; done
          node ada/wasm/chromium-acceptance.mjs > package/chromium.json
          cat package/chromium.json
          node ada/wasm/ledger-contention.test.mjs > package/ledger-contention.json
          node ada/wasm/ledger-abort.test.mjs > package/ledger-abort.json
          cat package/ledger-contention.json package/ledger-abort.json
      - name: Verify publication eligibility
        run: python3 ada/wasm/verify-publication-v2.py package "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ada-281n-wasm-package
          path: package/
  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ada-versioned-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: ada-281n-wasm-package
          path: accepted
      - name: Validate and append versioned binary
        run: |
          python3 ada/wasm/verify-publication-v2.py accepted "$GITHUB_SHA"
          dest="ada/wasm/releases/$GITHUB_SHA"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp accepted/{ada_browser.wasm,manifest.json,parity.json,reference-schema.json,chromium.json,ledger-contention.json,ledger-abort.json} "$dest/"
          git add -- "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ADA accepted WASM package $GITHUB_SHA"
          git push origin HEAD:main
