name: QG-037 Independent Closure Tests
on:
  push:
    paths:
      - "language/independent-closure.mjs"
      - "language/byzantine-84211.mjs"
      - "language/lossless-closure.mjs"
      - "tests/independent-closure.test.mjs"
      - ".github/workflows/independent-closure-tests.yml"
  pull_request:
    paths:
      - "language/independent-closure.mjs"
      - "language/byzantine-84211.mjs"
      - "language/lossless-closure.mjs"
      - "tests/independent-closure.test.mjs"
      - ".github/workflows/independent-closure-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/byzantine-84211.test.mjs tests/lossless-closure.test.mjs tests/independent-closure.test.mjs
