name: QG-057 Forecast Reliability Tests
on:
  push:
    paths:
      - "language/forecast-reliability.mjs"
      - "tests/forecast-reliability.test.mjs"
      - ".github/workflows/forecast-reliability-tests.yml"
  pull_request:
    paths:
      - "language/forecast-reliability.mjs"
      - "tests/forecast-reliability.test.mjs"
      - ".github/workflows/forecast-reliability-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/uncertain-waiting.test.mjs tests/forecast-reliability.test.mjs
