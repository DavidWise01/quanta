name: QG-052 Independent Information Tests
on:
  push:
    paths:
      - "language/independent-information.mjs"
      - "tests/independent-information.test.mjs"
      - ".github/workflows/independent-information-tests.yml"
  pull_request:
    paths:
      - "language/independent-information.mjs"
      - "tests/independent-information.test.mjs"
      - ".github/workflows/independent-information-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/observation-sufficiency.test.mjs tests/independent-information.test.mjs
