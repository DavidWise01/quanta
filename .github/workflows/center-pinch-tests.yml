name: QG-045 Center Pinch Tests
on:
  push:
    paths:
      - "language/center-pinch.mjs"
      - "tests/center-pinch.test.mjs"
      - ".github/workflows/center-pinch-tests.yml"
  pull_request:
    paths:
      - "language/center-pinch.mjs"
      - "tests/center-pinch.test.mjs"
      - ".github/workflows/center-pinch-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/center-pinch.test.mjs
