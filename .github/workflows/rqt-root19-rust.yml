name: RQT Root19 Rust Exact Verifier
on:
  push:
    paths:
      - 'rust/root19/**'
      - '.github/workflows/rqt-root19-rust.yml'
  workflow_dispatch:
jobs:
  rust-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/root19
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/root19
      - name: Test exact invariants
        run: cargo test --verbose
      - name: Run bounded source verifier
        run: cargo run --release --bin rqt-root19 -- 3000 > rqt688-results.json
      - name: RQT-702 verify exact rank-five Branch-2 ancestry
        run: cargo run --release --bin rqt702 > rqt702-branch2.json
      - name: RQT-701 reconstruct primitive predecessor from Wall cofactors
        run: cargo run --release --bin rqt701 > rqt701-predecessor.json
      - name: RQT-700 verify conditional divisibility and ancestry source
        run: cargo run --release --bin rqt700 > rqt700-ancestry.json
      - name: RQT-699 full-22D gate rejects missing embedding
        run: |
          if cargo run --release --bin rqt699 > rqt699-hold.log 2>&1; then
            echo 'ERROR: unauthenticated 22D inference accepted'
            exit 1
          fi
          grep -q 'RQT-699 HOLD' rqt699-hold.log
      - name: Verify RQT-698 exact F4 pairing parity
        run: cargo run --release --bin rqt698 > rqt698-pairing-parity.json
      - name: Verify QG-077 Rust bridge
        run: cargo run --release --bin rqt696 > rqt696-bridge.json
      - name: Verify immutable single-snapshot observation ledger
        run: cargo run --release --bin rqt694 > rqt694-ledger.json
      - name: Verify deterministic temporal and spatial addresses
        run: cargo run --release --bin rqt693 -- 4 > rqt693-addresses.json
      - name: Verify single 1131 universe snapshot
        run: cargo run --release --bin rqt692 -- 4 > rqt692-snapshot.json
      - name: Verify canonical recursive grammar
        run: cargo run --release --bin rqt691 -- 8 > rqt691-topology.json
      - name: Reject missing rational seed (fail-closed)
        run: |
          if cargo run --release --bin rqt690 -- 0 0 0 1 > rqt690-invalid.log 2>&1; then
            echo 'ERROR: invalid rational seed accepted'
            exit 1
          fi
          grep -q 'REJECT: supplied vector' rqt690-invalid.log
      - name: Bounded rational point scan (Rust)
        run: cargo run --release --bin rqt689 -- 33 1000 > rqt689-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: rqt688-rust-results
          path: |
            rust/root19/rqt688-results.json
            rust/root19/rqt689-results.json
            rust/root19/rqt691-topology.json
            rust/root19/rqt692-snapshot.json
            rust/root19/rqt693-addresses.json
            rust/root19/rqt694-ledger.json
            rust/root19/rqt698-pairing-parity.json
            rust/root19/rqt700-ancestry.json
            rust/root19/rqt701-predecessor.json
            rust/root19/rqt702-branch2.json
