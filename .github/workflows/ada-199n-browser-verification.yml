name: ADA-199N Browser Runtime Verification
on:
  push:
    branches: [main]
    paths:
      - 'ada/**'
      - '.github/workflows/ada-199n-browser-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned laboratory source integrity
        id: source_integrity
        run: node ada/ada-199n-source-integrity-test.mjs
      - name: Verify eight simulation cores and replay invariants
        id: core_replay
        run: node ada/ada-199n-eight-lab-core-test.mjs
      - name: Test seeded engine and deterministic replay
        id: seeded_replay
        run: node ada/ada-199n-deterministic-engine-test.mjs
      - name: Check WebGL1 WebGL2 and Canvas2D context detection
        id: renderer_probe
        run: node ada/ada-199n-renderer-probe-test.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve Pages source over HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ada199-server.log 2>&1 &
          echo $! > /tmp/ada199-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ada/ada-198n-3d-stress-recovery.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ada199-server.log
          exit 1
      - name: Run local WebGL Chromium verification
        id: local
        continue-on-error: true
        env:
          ADA_BASE_URL: http://127.0.0.1:8765
          ADA_REPORT_DIR: ada/verification-results/local
          ADA_REQUIRE_WEBGL: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Verify forced Canvas2D fallback in Chromium
        id: fallback
        if: always()
        continue-on-error: true
        env:
          ADA_BASE_URL: http://127.0.0.1:8765
          ADA_REPORT_DIR: ada/verification-results/fallback
          ADA_FORCE_CANVAS: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Verify published Pages source integrity
        id: pages_integrity
        if: always()
        continue-on-error: true
        env:
          ADA_PUBLIC_BASE: https://davidwise01.github.io/quanta
          ADA_REPORT_DIR: ada/verification-results/pages-integrity
        run: |
          # Pages deployment may lag the source push that triggered this workflow.
          # Never accept stale bytes; retry the entire pinned-source check.
          for attempt in $(seq 1 12); do
            echo "Pages integrity attempt ${attempt}/12"
            if node ada/ada-199n-pages-integrity.mjs; then
              echo "Exact pinned Pages bytes are deployed"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pinned Pages deployment not confirmed after 12 attempts"
              exit 1
            fi
            sleep 15
          done
      - name: Verify public Pages with Chromium
        id: public
        if: always()
        continue-on-error: true
        env:
          ADA_BASE_URL: https://davidwise01.github.io/quanta
          ADA_REPORT_DIR: ada/verification-results/public
          ADA_REQUIRE_WEBGL: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Upload browser evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-199n-browser-evidence
          path: ada/verification-results/
          if-no-files-found: warn
      - name: Strict final verification gate
        if: always()
        env:
          LOCAL: ${{ steps.local.outcome }}
          FALLBACK: ${{ steps.fallback.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
          PAGES_INTEGRITY: ${{ steps.pages_integrity.outcome }}
          SOURCE_INTEGRITY: ${{ steps.source_integrity.outcome }}
          CORE_REPLAY: ${{ steps.core_replay.outcome }}
          SEEDED_REPLAY: ${{ steps.seeded_replay.outcome }}
          RENDERER_PROBE: ${{ steps.renderer_probe.outcome }}
        run: |
          mkdir -p ada/verification-results
          node -e 'const fs=require("fs"); const keys=["SOURCE_INTEGRITY","CORE_REPLAY","SEEDED_REPLAY","RENDERER_PROBE","LOCAL","FALLBACK","PUBLIC","PAGES_INTEGRITY"]; const outcomes=Object.fromEntries(keys.map(k=>[k,process.env[k]||"not_run"])); const passed=keys.every(k=>outcomes[k]==="success"); fs.writeFileSync("ada/verification-results/gate.json",JSON.stringify({schema:"ADA-199N.gate.v2",passed,outcomes},null,2)+"\n"); console.log("Aggregate browser gate:",JSON.stringify({passed,outcomes})); if(!passed)process.exitCode=1'
      - name: Validate ADA-200N certificate issuer denial cases
        if: always()
        run: node ada/ada-200n-certificate.mjs --self-test
      - name: Issue ADA-200N evidence-bound certificate
        if: always()
        run: node ada/ada-200n-certificate.mjs
      - name: Upload ADA-200N certificate when validated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-200n-release-certificate
          path: ada/verification-results/ada-200n-release-certificate.json
          if-no-files-found: ignore
      - name: Report execution gate to release issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let gate;
            try {
              gate = JSON.parse(fs.readFileSync('ada/verification-results/gate.json', 'utf8'));
            } catch (e) {
              gate = { schema: 'ADA-199N.gate.v2', passed: false, outcomes: {}, error: 'gate.json unavailable: ' + e.message };
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              '### ADA-199N automated gate observation',
              '- Run: ' + runUrl,
              '- Commit: ' + context.sha,
              '- Run ID: ' + context.runId + ' · attempt: ' + process.env.GITHUB_RUN_ATTEMPT,
              '- Gate verdict: **' + (gate.passed === true ? 'PASS (preliminary)' : 'FAIL / unavailable') + '**',
              '- Gate schema: ' + (gate.schema || 'missing'),
              '- Outcomes: ' + JSON.stringify(gate.outcomes || {}),
              '- Certificate: inspect the completed workflow and `ada-200n-release-certificate` artifact before promoting the phase.',
              '- This comment is execution evidence, **not** proof that the full workflow completed successfully.'
            ];
            if (gate.error) lines.push('- Gate read error: ' + gate.error);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: lines.join('\n')
            });
      - name: Upload final gate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-199n-final-gate
          path: ada/verification-results/gate.json
          if-no-files-found: warn
