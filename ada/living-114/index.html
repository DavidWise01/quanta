<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ADA-114 Delta Singlet</title><style>body{background:#09121c;color:#d9eeed;font:16px monospace;max-width:850px;margin:40px auto;padding:16px}h1{color:#ffc07a}pre{background:#122732;color:#81e8cf;padding:22px;line-height:1.8}button{padding:10px;font:inherit}a{color:#81e8cf}</style><h1>ADA-114 · Delta Singlet</h1><p>[ {n}^n (s) {n}^n ] · .dlw</p><button id="step">Next epoch</button> <button id="reset">Reset</button><pre id="view"></pre><p>Versioned changed-state records only after bootstrap. Reliable synchronized rounds; no packet-loss recovery. Message counts exclude transport headers and resource transfers.</p><a href="../living-113/">ADA-113</a><script type="module">// ADA-114 .dlw — versioned, deduplicated delta flooding on a synchronous torroid.
export function run(initial=[9,3,0,6,2,1,8,4,3]){
 const q=initial.slice(),n=9,adj=Array.from({length:n},()=>[]);
 for(let i=0;i<n;i++)for(const j of [3*Math.floor(i/3)+(i%3+1)%3,3*((Math.floor(i/3)+1)%3)+i%3]){adj[i].push(j);adj[j].push(i);}
 const total=q.reduce((a,b)=>a+b,0),energy=()=>q.reduce((a,b)=>a+(9*b-total)**2,0);
 let views=q.map((v,i)=>new Map([[i,{id:i,version:0,value:v}]])), versions=Array(n).fill(0),messages=0,records=0,moves=0,epochs=0;
 const history=[q.slice()],events=[];
 function flood(front){
  for(let r=0;r<2;r++){
   const next=Array.from({length:n},()=>new Map());
   for(let i=0;i<n;i++)if(front[i].size)for(const j of adj[i]){
    messages++;records+=front[i].size;
    for(const [k,v] of front[i]){const prev=views[j].get(k);if(!prev||prev.version<v.version){views[j].set(k,v);next[j].set(k,v);}}
   }
   front=next;
  }
  if(views.some(v=>v.size!==n||q.some((x,i)=>v.get(i).value!==x||v.get(i).version!==versions[i])))throw Error("stale view");
 }
 flood(views.map(v=>new Map(v)));
 const bootstrap=messages;
 while(true){
  const decisions=views.map(v=>{const a=[...v.values()].sort((a,b)=>b.value-a.value||a.id-b.id),b=[...v.values()].sort((a,b)=>a.value-b.value||a.id-b.id);return [a[0].id,b[0].id,a[0].value-b[0].value];});
  const [s,d,g]=decisions[0];if(decisions.some(v=>v.join()!=decisions[0].join()))throw Error("agreement");
  if(g<2)break;
  const parent=Array(n).fill(-1),queue=[s];parent[s]=s;
  for(let k=0;k<queue.length;k++)for(const v of [...adj[queue[k]].sort((a,b)=>a-b)])if(parent[v]<0){parent[v]=queue[k];queue.push(v);}
  const path=[d];while(path[0]!==s)path.unshift(parent[path[0]]);
  const before=energy(),start=messages;
  for(let k=0;k<path.length-1;k++){if(q[path[k]]<=0)throw Error("negative");q[path[k]]--;q[path[k+1]]++;moves++;}
  if(q.reduce((a,b)=>a+b,0)!==total||energy()>=before)throw Error("invariant");
  const front=Array.from({length:n},()=>new Map());
  for(const i of [s,d]){const v={id:i,version:++versions[i],value:q[i]};views[i].set(i,v);front[i].set(i,v);}
  flood(front);
  epochs++;events.push({epoch:epochs,path,before,after:energy(),messages:messages-start,delta:[{id:s,delta:-1},{id:d,delta:1}]});history.push(q.slice());
 }
 return {initial,final:q,total,energy:energy(),epochs,moves,messages,records,bootstrap,history,events};
}
export function test(){const fixture=run(),corners=Array.from({length:9},(_,i)=>run(Array.from({length:9},(_,j)=>i===j?36:0)));let seed=113;const random=[];for(let k=0;k<64;k++){const q=Array(9).fill(0);for(let j=0;j<36;j++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;q[seed%9]++;}random.push(run(q));}if([fixture,...corners,...random].some(r=>r.energy!==0))throw Error("balance");return {fixture,corners,random};}

const r=run();let t=0;const el=id=>document.getElementById(id);function draw(){const q=r.history[t];el('view').textContent='      OCHRE EMERALD TEAL\n'+[0,1,2].map(k=>' G'+k+'   '+q.slice(k*3,k*3+3).join('     ')).join('\n')+'\n\n          (( S ))\nEpoch '+t+' / '+r.epochs+' | Sum '+r.total+'\nMessages '+(r.bootstrap+r.events.slice(0,t).reduce((s,e)=>s+e.messages,0))+'\n'+(t?'Route '+r.events[t-1].path.join(' → '):'Bootstrap');}el('step').onclick=()=>{t=Math.min(t+1,r.epochs);draw()};el('reset').onclick=()=>{t=0;draw()};draw();</script></html>
