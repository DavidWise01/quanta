name: QG-053 No Wasted Movement Tests
on:
  push:
    paths:
      - "language/no-wasted-movement.mjs"
      - "tests/no-wasted-movement.test.mjs"
      - ".github/workflows/no-wasted-movement-tests.yml"
  pull_request:
    paths:
      - "language/no-wasted-movement.mjs"
      - "tests/no-wasted-movement.test.mjs"
      - ".github/workflows/no-wasted-movement-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/independent-information.test.mjs tests/no-wasted-movement.test.mjs
