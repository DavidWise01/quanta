<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION 159B · Stargate tornado</title><style>*{box-sizing:border-box}body{margin:0;background:#080b16;color:#dfefff;font:14px system-ui}header{padding:15px 24px;border-bottom:1px solid #344056;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0;letter-spacing:2px;color:#8ce8ff}small{color:#92a5bc}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);min-height:80vh}canvas{width:100%;height:80vh;display:block}aside{padding:20px;border-left:1px solid #344056}button{background:#18263b;border:1px solid #58bdda;color:#e5fcff;border-radius:6px;padding:9px;margin:4px;cursor:pointer}input{width:100%;accent-color:#5eddf7}pre{white-space:pre-wrap;font-size:12px;color:#b4e5ff}#bits{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}#bits button{padding:4px;margin:0;font:12px monospace}#phase{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}#phase span{text-align:center;padding:9px 0;border:1px solid #334155;border-radius:4px}#phase .on{background:#d87832;color:white} @media(max-width:720px){main{display:block}canvas{height:59vh}aside{border-left:0}}</style></head><body><header><div><h1>A.I.O.N. 159B / STARGATE</h1><small>00 11 [ 24 /|\\ 42 ] 11 00 · .dlw</small></div><div>VECTOR / VOXEL / VOGEL</div></header><main><canvas id="view"></canvas><aside><h2>Phase engine</h2><div id="phase"></div><p><label>Base x (arcseconds): <b id="val"></b><input id="x" type="range" min="0" max="10" step=".025" value="1"></label></p><button id="play">Pause</button><button id="step">Step</button><button id="reset">Reset</button><h3>42-bit payload</h3><div id="bits"></div><pre id="out"></pre><small>Angular motion exaggerated. Three synchronized layers; each phase is an event, not an additional payload bit.</small></aside></main><script type="module">// ADA-159B .dlw — 42-bit Stargate, three-layer tornado.
export const GATE="00 11 [ 24 /|\\ 42 ] 11 00";
export const WIDTH=42, TURN=1296000000, OFFSET=1025;
export const LAYERS=Object.freeze(["|V| vector","[] voxel","{[()]} vogel"]);
export function pack(s,c,i,w){const a=[s,c,i,w],n=[24,9,1,8];if(a.some((v,j)=>typeof v!=="bigint"||v<0n||v>=1n<<BigInt(n[j])))throw Error("width");return s|(c<<24n)|(i<<33n)|(w<<34n);}
export function unpack(v){if(typeof v!=="bigint"||v<0n||v>=1n<<42n)throw Error("width");return [v&0xffffffn,(v>>24n)&511n,(v>>33n)&1n,(v>>34n)&255n];}
export function step(s,x){if(!Number.isSafeInteger(x)||x<0||x>TURN)throw Error("x in milliarcseconds");const phase=s.tick%8,pull=phase>=4,delta=pull?-(x+OFFSET):x;return {tick:s.tick+1,angle:((s.angle+delta)%TURN+TURN)%TURN,net:s.net+delta,phase,pull,delta};}
export function cycle(x){let s={tick:0,angle:0,net:0};const ledger=[];for(let i=0;i<8;i++){s=step(s,x);ledger.push({...s});}return {state:s,ledger};}
export function verify(){let cases=0;for(const x of [0,1,1000,1025,123456,TURN-1,TURN]){const {state,ledger}=cycle(x);if(state.net!==-4100||ledger.filter(v=>v.pull).length!==4||ledger.some(v=>v.angle<0||v.angle>=TURN))throw Error("cycle");cases++;}let v=0n;for(let j=0;j<42;j++){v=1n<<BigInt(j);if(pack(...unpack(v))!==v)throw Error("packing");cases++;}return {cases,netMilliarcseconds:-4100,phases:8,layers:3,layerEvents:24};}

const canvas=document.getElementById("view"),ctx=canvas.getContext("2d"),el=id=>document.getElementById(id);let state={tick:0,angle:0,net:0},running=true,last=0,v=(1n<<42n)-1n;
function x(){return Math.round(Number(el("x").value)*1000)}function advance(){state=step(state,x());}
function ui(){el("val").textContent=(x()/1000).toFixed(3);el("phase").innerHTML=Array.from({length:8},(_,i)=>'<span class="'+(state.tick&&i===(state.tick-1)%8?'on':'')+'">'+(i<4?'+':'−')+(i%4+1)+'</span>').join("");el("out").textContent="PHASE "+state.tick+"\nPUSH +"+(x()/1000).toFixed(3)+'″ ×4\nPULL −'+((x()+OFFSET)/1000).toFixed(3)+'″ ×4\nNET '+(state.net/1000).toFixed(3)+'″ per layer\nWRAPPED '+(state.angle/1000).toFixed(3)+'″\nWORD 0x'+v.toString(16).padStart(11,"0")+"\nTESTS "+verify().cases;el("bits").innerHTML=Array.from({length:42},(_,i)=>'<button data-i="'+i+'" style="color:'+['#fa6069','#51a4ff','#39e9ac','#d6d8e1','#b795ff','#ffab5b'][i<24?Math.floor(i/8):i<33?3:i===33?4:5]+'">'+((v>>BigInt(i))&1n)+'</button>').join("");}
el("bits").onclick=e=>{if(e.target.dataset.i!==undefined){v^=1n<<BigInt(e.target.dataset.i);ui();}};el("play").onclick=()=>{running=!running;el("play").textContent=running?"Pause":"Play";};el("step").onclick=()=>{running=false;el("play").textContent="Play";advance();ui();};el("reset").onclick=()=>{state={tick:0,angle:0,net:0};ui();};el("x").oninput=ui;
function frame(t){if(running&&t-last>650){advance();last=t;ui();}const d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#080b16";ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)*.44,cx=w/2,cy=h*.51,spin=state.net/1000*.16+(running?t*.00025:0),pull=state.tick>0&&(state.tick-1)%8>=4;
function pos(z,a,r){const X=Math.cos(a)*r,Y=Math.sin(a)*r;return [cx+scale*X,cy+scale*(z*.95+Y*.24)];}
const layers=[{color:"#49baff",name:"|V|",rad:1},{color:"#ff9d53",name:"[]",rad:.78},{color:"#b18bff",name:"{[()]}",rad:.56}];for(let k=0;k<3;k++){const l=layers[k];for(let arm=0;arm<4;arm++){ctx.beginPath();for(let j=0;j<=120;j++){const u=j/120,z=1-2*u,a=spin+(pull?-1:1)*u*10+arm*Math.PI/2+k*.28,r=(.08+.92*u)*l.rad;const p=pos(z,a,r);if(j===0)ctx.moveTo(...p);else ctx.lineTo(...p);}ctx.strokeStyle=l.color;ctx.globalAlpha=.7;ctx.lineWidth=1.7;ctx.stroke();ctx.globalAlpha=1;for(let j=0;j<8;j++){const u=(j+.5)/8,a=spin+(pull?-1:1)*u*10+arm*Math.PI/2+k*.28,p=pos(1-2*u,a,(.08+.92*u)*l.rad);ctx.strokeStyle=l.color;ctx.fillStyle=l.color;if(k===0){ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(p[0]+8*Math.cos(a+.4),p[1]+8*Math.sin(a+.4));ctx.stroke();}else if(k===1){ctx.strokeRect(p[0]-3,p[1]-3,6,6);}else{ctx.beginPath();ctx.ellipse(p[0],p[1],5,3,a,0,Math.PI*2);ctx.stroke();ctx.fillRect(p[0]-1,p[1]-1,2,2);}}}}
ctx.strokeStyle="#65748b";ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(cx,cy-scale*.95);ctx.lineTo(cx,cy+scale*.95);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#faf0ff";ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();ctx.font="13px monospace";ctx.fillText("{{s}}",cx+12,cy);ctx.fillStyle=pull?"#ff9d53":"#5ee7dd";ctx.fillText(pull?"PULL ×4":"PUSH ×4",20,25);requestAnimationFrame(frame);}ui();requestAnimationFrame(frame);</script></body></html>
