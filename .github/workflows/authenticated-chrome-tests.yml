name: QG-015 Authenticated Chrome Dot tests
on:
  push:
    paths:
      - 'language/authenticated-chrome.mjs'
      - 'language/recoverable-fold.mjs'
      - 'language/downward-spiral.mjs'
      - 'tests/authenticated-chrome.test.mjs'
      - '.github/workflows/authenticated-chrome-tests.yml'
  pull_request:
    paths:
      - 'language/authenticated-chrome.mjs'
      - 'tests/authenticated-chrome.test.mjs'
      - '.github/workflows/authenticated-chrome-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/authenticated-chrome.test.mjs
