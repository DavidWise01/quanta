name: QG-067 Revocation Outlives Recovery Tests
on:
  push:
    paths:
      - "language/revocation-outlives-recovery.mjs"
      - "tests/revocation-outlives-recovery.test.mjs"
      - ".github/workflows/revocation-outlives-recovery-tests.yml"
  pull_request:
    paths:
      - "language/revocation-outlives-recovery.mjs"
      - "tests/revocation-outlives-recovery.test.mjs"
      - ".github/workflows/revocation-outlives-recovery-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/recovery-without-old-key.test.mjs tests/revocation-outlives-recovery.test.mjs
