<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AION 126</title><style>body{background:#09121c;color:#d9eeed;font:16px monospace;max-width:850px;margin:30px auto;padding:16px}h1{color:#ffc07a}pre{background:#122732;padding:22px;color:#81e8cf}button,select{padding:10px;font:inherit}</style><h1>A.I.O.N. 126 · Dormancy</h1><p>One Hegemon · (inf) - + [inf] · PB208 · .dlw</p><select id="scenario"><option>stable</option><option>shift</option><option>recover</option><option>novel</option></select> <button id="next">Advance</button><pre id="out"></pre><p>Actual nine-model sleep: no forecasts or Bayesian updates until wake. Missed observations replayed from memory; replay updates counted. No measured hardware energy claim.</p><script type="module">// ADA-126 .dlw — actual dormancy, lazy replay from observed flip ledger.
export const rates=[.02,.08,.14,.20,.28,.36,.45,.60,.80];
export function forecast(q,d,p){const a=Array(26).fill(0);for(const [o,w] of [[2*d,(1-p)**2],[-2*d,p*(1-p)],[0,p]])a[(q+o+26)%26]+=w;return a;}
export function run(seed,scenario="shift"){
 let x=seed>>>0,q=0,d=1,w=.02,bank=rates.map((_,i)=>i===1?.84:.02),cursor=0,fast=.08,awake=0,loss=0,forecasts=0,updates=0,wakes=0,was=false;
 const flips=[0],ledger=[],scores=[],presist=[],memory=[];
 for(let t=0;t<208;t++){
 if(t){x=(Math.imul(x,1664525)+1013904223)>>>0;const p=scenario==="novel"?(t<70?.14:t<140?.60:.28):scenario==="shift"&&t>=104||scenario==="recover"&&t>=69&&t<139?.45:.08;const flip=Number(x/4294967296<p);flips.push(flip);if(flip)d=-d;q=(q+d+26)%26;fast=.12*flip+.88*fast;const prior=w*.985+(1-w)*.015,a=prior*(flip?.45:.55),b=(1-prior)*(flip?.08:.92);w=a/(a+b);updates+=2;}
 // Wake on ambiguous regime, mismatch, or periodic probe; stay awake for 8 ticks.
 const trigger=t%32===0||Math.abs(fast-((1-w)*.08+w*.45))>.12||(w>=.25&&w<=.75);
 if(trigger)awake=8;else awake=Math.max(0,awake-1);
 const active=awake>0;if(active&&!was)wakes++;was=active;
 const lo=forecast(q,d,.08),hi=forecast(q,d,.45);forecasts+=2;
 let prediction=lo.map((v,i)=>(1-w)*v+w*hi[i]);
 if(active){
 // Replay missed observations only on wake; no nine-model updates or forecasts during sleep.
 while(cursor<t){const flip=flips[++cursor],u=bank.map((v,i)=>(.985*v+.015/9)*(flip?rates[i]:1-rates[i])),z=u.reduce((a,b)=>a+b,0);bank=u.map(v=>v/z);updates+=9;}
 const p9=Array(26).fill(0);for(let m=0;m<9;m++){const a=forecast(q,d,rates[m]);forecasts++;for(let j=0;j<26;j++)p9[j]+=bank[m]*a[j];}prediction=prediction.map((v,i)=>(v+p9[i])/2);
 }
 if(t>=2){const f=ledger[t-2],e=f.prediction.reduce((a,v,i)=>a+(v-Number(i===q))**2,0);loss+=e;scores.push({issued:t-2,target:t,actual:q,loss:e});}
 ledger.push(Object.freeze({issued:t,target:t+2,q,active,cursor,forecasts,updates,prediction:Object.freeze(prediction)}));memory.push({t,flip:flips[t],active,cursor});presist.push({t,q,w,active});if(presist.length>3)presist.shift();
 }
 return {seed,scenario,count:scores.length,loss,forecasts,updates,wakes,sleepTicks:ledger.filter(f=>!f.active).length,ledger,scores,presist,memory};
}

let t=0,r=run(7000,"stable");const e=id=>document.getElementById(id);function draw(){const f=r.ledger[t];e("out").textContent="PB "+t+" arcsec | target "+f.target+"\nNine-model bank "+(f.active?"AWAKE":"DORMANT")+"\nReplay cursor "+f.cursor+" | Forecast calls "+f.forecasts+"\nModel updates "+f.updates;}e("next").onclick=()=>{t=Math.min(207,t+1);draw()};e("scenario").onchange=()=>{t=0;r=run(7000,e("scenario").value);draw()};draw();</script>
