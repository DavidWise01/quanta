name: RIEMANN-010 Rust WASM build and Pages asset publication

on:
  push:
    paths:
      - 'research/riemann-rust/**'
      - 'research/riemann-wasm/**'
      - 'docs/riemann-rust/index.html'
      - '.github/workflows/riemann010-rust-wasm-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann010-wasm
  cancel-in-progress: false

jobs:
  rust-wasm-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up pinned Rust and WebAssembly target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustc +1.85.1 --version
          cargo +1.85.1 --version
      - name: Normalize source formatting in ephemeral checkout
        shell: bash
        run: |
          cargo +1.85.1 fmt --manifest-path research/riemann-rust/Cargo.toml --all
          cargo +1.85.1 fmt --manifest-path research/riemann-wasm/Cargo.toml --all
      - name: Test Rust native crates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/riemann010-evidence
          cargo +1.85.1 test --manifest-path research/riemann-rust/Cargo.toml --all-targets --offline 2>&1 | tee /tmp/riemann010-evidence/core-tests.log
          cargo +1.85.1 test --manifest-path research/riemann-wasm/Cargo.toml --offline 2>&1 | tee /tmp/riemann010-evidence/wasm-adapter-tests.log
      - name: Build actual browser WASM
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 build --manifest-path research/riemann-wasm/Cargo.toml --target wasm32-unknown-unknown --release --offline
          wasm=research/riemann-wasm/target/wasm32-unknown-unknown/release/quanta_toroidal_wasm.wasm
          test -s "$wasm"
          cp "$wasm" docs/riemann-rust/toroid.wasm
          sha256sum docs/riemann-rust/toroid.wasm | tee /tmp/riemann010-evidence/wasm-sha256.txt
          python3 - <<'PY'
          import pathlib
          raw=pathlib.Path('docs/riemann-rust/toroid.wasm').read_bytes()
          assert raw[:4]==b'\x00asm', 'not a WASM binary'
          assert len(raw)>256, 'too small to be compiled engine'
          print('WASM header and minimum length verified')
          PY
      - name: Publish only compiled WASM asset into existing Pages tree
        shell: bash
        run: |
          set -euo pipefail
          wasm=/tmp/riemann010-toroid.wasm
          cp docs/riemann-rust/toroid.wasm "$wasm"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard HEAD  # discard disposable rustfmt changes before switching to main
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p docs/riemann-rust
            cp "$wasm" docs/riemann-rust/toroid.wasm
            git add docs/riemann-rust/toroid.wasm
            if git diff --cached --quiet; then
              echo 'WASM artifact already up-to-date'
              break
            fi
            git commit -m 'build: publish pinned RIEMANN-010 Rust WebAssembly artifact'
            if git push origin HEAD:main; then
              echo 'Compiled WASM asset pushed'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo 'Failed to publish after retries' >&2
              exit 1
            fi
          done
      - name: Upload reproducibility receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann010-rust-wasm-receipts
          path: /tmp/riemann010-evidence/
          if-no-files-found: warn
