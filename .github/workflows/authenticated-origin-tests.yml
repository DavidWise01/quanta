name: QG-038 Authenticated Origin Tests
on:
  push:
    paths:
      - "language/authenticated-origin.mjs"
      - "language/independent-closure.mjs"
      - "tests/authenticated-origin.test.mjs"
      - ".github/workflows/authenticated-origin-tests.yml"
  pull_request:
    paths:
      - "language/authenticated-origin.mjs"
      - "language/independent-closure.mjs"
      - "tests/authenticated-origin.test.mjs"
      - ".github/workflows/authenticated-origin-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/authenticated-origin.test.mjs
