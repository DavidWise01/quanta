name: QG-027 Semantic triad tests
on:
  push:
    paths:
      - 'language/semantic-triad.mjs'
      - 'tests/semantic-triad.test.mjs'
      - '.github/workflows/semantic-triad-tests.yml'
  pull_request:
    paths:
      - 'language/semantic-triad.mjs'
      - 'tests/semantic-triad.test.mjs'
      - '.github/workflows/semantic-triad-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-triad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/semantic-triad.test.mjs
