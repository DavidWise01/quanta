name: QG-041 Emergent Observer Tests
on:
  push:
    paths:
      - "language/emergent-observer.mjs"
      - "tests/emergent-observer.test.mjs"
      - ".github/workflows/emergent-observer-tests.yml"
  pull_request:
    paths:
      - "language/emergent-observer.mjs"
      - "tests/emergent-observer.test.mjs"
      - ".github/workflows/emergent-observer-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/emergent-observer.test.mjs
