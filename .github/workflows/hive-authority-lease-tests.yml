name: QG-071 Authority Lease Tests
on:
  push:
    paths:
      - "language/hive-authority-lease.mjs"
      - "tests/hive-authority-lease.test.mjs"
      - ".github/workflows/hive-authority-lease-tests.yml"
  pull_request:
    paths:
      - "language/hive-authority-lease.mjs"
      - "tests/hive-authority-lease.test.mjs"
      - ".github/workflows/hive-authority-lease-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/hive-fresh-challenge.test.mjs tests/hive-authority-lease.test.mjs
