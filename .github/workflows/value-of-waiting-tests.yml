name: QG-055 Value of Waiting Tests
on:
  push:
    paths:
      - "language/value-of-waiting.mjs"
      - "tests/value-of-waiting.test.mjs"
      - ".github/workflows/value-of-waiting-tests.yml"
  pull_request:
    paths:
      - "language/value-of-waiting.mjs"
      - "tests/value-of-waiting.test.mjs"
      - ".github/workflows/value-of-waiting-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/cost-of-knowing.test.mjs tests/value-of-waiting.test.mjs
