<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION 159C · Antistrophic Stargate</title><style>*{box-sizing:border-box}body{margin:0;background:#080b16;color:#dfefff;font:14px system-ui}header{padding:16px;border-bottom:1px solid #344056}h1{font-size:20px;margin:0;color:#8ce8ff;letter-spacing:2px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(285px,1fr)}canvas{width:100%;height:82vh;display:block}aside{padding:18px;border-left:1px solid #344056}button{background:#18263b;border:1px solid #58bdda;color:#e5fcff;border-radius:6px;padding:9px;margin:4px;cursor:pointer}input{width:100%;accent-color:#5eddf7}pre{white-space:pre-wrap;color:#b4e5ff}#phases div{display:flex;gap:4px;margin:5px 0}#phases span{flex:1;text-align:center;border:1px solid #344056;border-radius:3px;padding:5px 0}#bits{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}#bits button{padding:3px;margin:0}@media(max-width:720px){main{display:block}canvas{height:60vh}}</style><header><h1>A.I.O.N. 159C / ANTISTROPHIC TORNADO</h1>00 11 [ 24 /|\\ 42 ] 11 00 · .dlw</header><main><canvas id="view"></canvas><aside><h2>Three independent phase registers</h2><div id="phases"></div><label>Next cycle x (arcseconds)<input id="x" type="range" min="0" max="10" step=".025" value="1"></label><button id="play">Pause</button><button id="step">Step</button><button id="reset">Reset</button><pre id="out"></pre><h3>42-bit payload</h3><div id="bits"></div><small>Angles exaggerated. x is held constant within each cycle.</small></aside></main><script type="module">// ADA-159B .dlw — 42-bit Stargate, three-layer tornado.
export const GATE="00 11 [ 24 /|\\ 42 ] 11 00";
export const WIDTH=42, TURN=1296000000, OFFSET=1025;
export const LAYERS=Object.freeze(["|V| vector","[] voxel","{[()]} vogel"]);
export function pack(s,c,i,w){const a=[s,c,i,w],n=[24,9,1,8];if(a.some((v,j)=>typeof v!=="bigint"||v<0n||v>=1n<<BigInt(n[j])))throw Error("width");return s|(c<<24n)|(i<<33n)|(w<<34n);}
export function unpack(v){if(typeof v!=="bigint"||v<0n||v>=1n<<42n)throw Error("width");return [v&0xffffffn,(v>>24n)&511n,(v>>33n)&1n,(v>>34n)&255n];}

 // ADA-159C .dlw — antistrophic circulation, local phase offsets.
export const FRAME=Object.freeze([{name:"|V| vector",hand:1,phase:0},{name:"[] voxel",hand:-1,phase:2},{name:"{[()]} vogel",hand:1,phase:4}].map(Object.freeze));
const wrap=a=>((a%TURN)+TURN)%TURN;
export function initial(){return {tick:0,x:null,layers:FRAME.map((f,i)=>({...f,angle:i*TURN/3,net:0,push:0,pull:0}))};}
export function step(s,x){if(!Number.isSafeInteger(x)||x<0||x>TURN)throw Error("x in milliarcseconds");const latched=s.tick%8===0?x:s.x;
 return {tick:s.tick+1,x:latched,layers:s.layers.map(l=>{const p=(s.tick+l.phase)%8,pull=p>=4,local=pull?-(latched+OFFSET):latched,delta=l.hand*local;
 return {...l,p,delta,angle:wrap(l.angle+delta),net:l.net+delta,push:l.push+Number(!pull),pull:l.pull+Number(pull)};})};}
export function verify(){let cases=0;for(const x of [0,1,1000,1025,123456,TURN-1,TURN]){let s=initial();for(let n=0;n<80;n++){s=step(s,n%8===0?x:0);if(s.layers.some(l=>l.angle<0||l.angle>=TURN))throw Error("wrap");if((n+1)%8===0){const cycles=(n+1)/8;for(const l of s.layers)if(l.net!==-4100*l.hand*cycles||l.push!==4*cycles||l.pull!==4*cycles)throw Error("balance");cases++;}}}
 for(let i=0;i<42;i++){const v=1n<<BigInt(i);if(pack(...unpack(v))!==v)throw Error("payload");cases++;}
 let s=initial();const ledger=[];for(let i=0;i<8;i++){s=step(s,1000);ledger.push(s);}return {cases,cycleNet:s.layers.map(l=>l.net),events:24,ledger};}

const el=id=>document.getElementById(id),c=el("view"),ctx=c.getContext("2d"),colors=["#38bdf8","#fb923c","#b18bff"];let s=initial(),running=true,last=0,v=(1n<<42n)-1n;const advance=()=>{s=step(s,Math.round(Number(el("x").value)*1000));ui();};
function ui(){el("phases").innerHTML=s.layers.map((l,k)=>'<b style="color:'+colors[k]+'">'+l.name+' / '+(l.hand>0?"+":"−")+'</b><div>'+Array.from({length:8},(_,i)=>'<span style="background:'+(s.tick&&l.p===i?colors[k]:"transparent")+'">'+(i<4?"+":"−")+(i%4+1)+'</span>').join("")+'</div>').join("");el("out").textContent="TICK "+s.tick+" | x="+(s.x===null?"unset":s.x/1000)+"″\\n"+s.layers.map(l=>l.name+": "+(l.net/1000).toFixed(3)+"″ | "+l.push+"/"+l.pull).join("\\n")+"\\nWORD "+v.toString(16).padStart(11,"0")+"\\nTESTS "+verify().cases;el("bits").innerHTML=Array.from({length:42},(_,i)=>'<button data-i="'+i+'" style="color:'+["#ef4444","#3b82f6","#10b981","#ccc","#b18bff","#fb923c"][i<24?Math.floor(i/8):i<33?3:i===33?4:5]+'">'+((v>>BigInt(i))&1n)+'</button>').join("");}
el("bits").onclick=e=>{if(e.target.dataset.i!==undefined){v^=1n<<BigInt(e.target.dataset.i);ui();}};el("play").onclick=()=>{running=!running;el("play").textContent=running?"Pause":"Play";};el("step").onclick=()=>{running=false;el("play").textContent="Play";advance();};el("reset").onclick=()=>{s=initial();ui();};
function frame(t){if(running&&t-last>650){advance();last=t;}const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#080b16";ctx.fillRect(0,0,w,h);const sc=Math.min(w,h)*.43,cx=w/2,cy=h*.51;
for(let k=0;k<3;k++){const l=s.layers[k],spin=k*2*Math.PI/3+l.net/1000*.20;for(let arm=0;arm<4;arm++){ctx.beginPath();for(let j=0;j<=120;j++){const u=j/120,a=spin+l.hand*u*12+arm*Math.PI/2,r=(.08+.92*u)*(1-k*.22),X=cx+sc*r*Math.cos(a),Y=cy+sc*(1-2*u+r*.22*Math.sin(a));if(j===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}ctx.strokeStyle=colors[k];ctx.lineWidth=2;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;}}
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();ctx.font="13px monospace";ctx.fillText("{{s}}",cx+12,cy);requestAnimationFrame(frame);}ui();requestAnimationFrame(frame);</script>
