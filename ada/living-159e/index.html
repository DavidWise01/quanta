<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION 159E · Homeostatic tornado</title><style>*{box-sizing:border-box}body{margin:0;background:#070b16;color:#deefff;font:14px system-ui}header{padding:16px 22px;border-bottom:1px solid #35425a}h1{font-size:20px;margin:0;color:#90ecff;letter-spacing:2px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(285px,1fr)}canvas{width:100%;height:82vh;display:block}aside{padding:18px;border-left:1px solid #35425a}button{background:#18263b;border:1px solid #58bdda;color:#e5fcff;border-radius:6px;padding:9px;margin:4px;cursor:pointer}input{width:100%;accent-color:#5eddf7}pre{white-space:pre-wrap;color:#b4e5ff}#bits{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}#bits button{padding:3px;margin:0}@media(max-width:720px){main{display:block}canvas{height:65vh}}</style></head><body><header><h1>A.I.O.N. 159E / HOMEOSTATIC TORNADO</h1>00 11 [ 24 /|\\ 42 ] 11 00 · .dlw</header><main><canvas id="view"></canvas><aside><h2>Bounded reconciliation</h2><label>Wave x (arcseconds)<input id="x" type="range" min="0" max="10" step=".025" value="1"></label><label>Disturbance (arcseconds)<input id="d" type="range" min="-10" max="10" step=".025" value="4.1"></label><label>Correction cap (arcseconds)<input id="cap" type="range" min="0" max="4.1" step=".025" value="1.025"></label><button id="hit">Inject impulse</button><button id="hold">Persistent disturbance: off</button><button id="play">Pause</button><button id="step">Step</button><button id="reset">Reset</button><pre id="out"></pre><h3>Shared 42-bit payload</h3><div id="bits"></div><small>Controller observes previous tick. Angular motion exaggerated.</small></aside></main><script type="module">// ADA-159B .dlw — 42-bit Stargate, three-layer tornado.
export const GATE="00 11 [ 24 /|\\ 42 ] 11 00";
export const WIDTH=42, TURN=1296000000, OFFSET=1025;
export const LAYERS=Object.freeze(["|V| vector","[] voxel","{[()]} vogel"]);
export function pack(s,c,i,w){const a=[s,c,i,w],n=[24,9,1,8];if(a.some((v,j)=>typeof v!=="bigint"||v<0n||v>=1n<<BigInt(n[j])))throw Error("width");return s|(c<<24n)|(i<<33n)|(w<<34n);}
export function unpack(v){if(typeof v!=="bigint"||v<0n||v>=1n<<42n)throw Error("width");return [v&0xffffffn,(v>>24n)&511n,(v>>33n)&1n,(v>>34n)&255n];}


 // ADA-159D .dlw — mirrored, equal-time antistrophic pairs.
export const FRAME=Object.freeze([{name:"vector",hand:1,phase:0},{name:"voxel",hand:-1,phase:2},{name:"vogel",hand:1,phase:4}].map(Object.freeze));
const wrap=a=>((a%TURN)+TURN)%TURN;
export function initial(){return {tick:0,x:null,layers:[1,-1].flatMap(side=>FRAME.map((f,i)=>({...f,side,hand:f.hand*side,angle:wrap(side*i*TURN/3),net:0,push:0,pull:0,travel:0})))};}
export function step(s,x){if(!Number.isSafeInteger(x)||x<0||x>TURN)throw Error("x in milliarcseconds");const latched=s.tick%8===0?x:s.x;
 return {tick:s.tick+1,x:latched,layers:s.layers.map(l=>{const p=(s.tick+l.phase)%8,pull=p>=4,local=pull?-(latched+OFFSET):latched,delta=l.hand*local;
 return {...l,p,delta,angle:wrap(l.angle+delta),net:l.net+delta,push:l.push+Number(!pull),pull:l.pull+Number(pull),travel:l.travel+Math.abs(delta)};})};}
export function check(s){for(let i=0;i<3;i++){const a=s.layers[i],b=s.layers[i+3];if(a.net+b.net!==0||a.delta+b.delta!==0||wrap(a.angle+b.angle)!==0||a.push!==b.push||a.pull!==b.pull||a.travel!==b.travel)throw Error("mirror");}if(s.layers.reduce((v,l)=>v+l.net,0)!==0)throw Error("net");}

// ADA-159E .dlw — bounded pairwise homeostasis, one-tick observation delay.
export const CAP=1025;
export function homeInitial(){return {...initial(),correction:0,disturbance:0,errors:[0,0,0]};}
export function homeStep(s,x,dist=[0,0,0],cap=CAP){
 if(!Number.isSafeInteger(cap)||cap<0||cap>TURN||dist.length!==3||dist.some(d=>!Number.isSafeInteger(d)||Math.abs(d)>TURN))throw Error("input");
 const base=step(s,x),commands=s.errors.map(e=>-Math.sign(e)*Math.min(Math.abs(e),cap));
 const layers=base.layers.map((l,i)=>{const d=i<3?dist[i]:commands[i-3];return {...l,nominal:l.delta,delta:l.delta+d,angle:wrap(l.angle+d),net:l.net+d,travel:l.travel-Math.abs(l.delta)+Math.abs(l.delta+d),adjustment:d};});
 const errors=layers.slice(0,3).map((l,i)=>l.net+layers[i+3].net);
 return {...base,layers,errors,commands,dist:[...dist],correction:s.correction+commands.reduce((a,b)=>a+Math.abs(b),0),disturbance:s.disturbance+dist.reduce((a,b)=>a+Math.abs(b),0)};
}
export function verify(){let ticks=0,pairs=0,impulses=0,overloads=0,bitChecks=0;let sample=[];
 function advance(s,x,d,c=CAP){const q=homeStep(s,x,d,c);for(let i=0;i<3;i++){const expected=s.errors[i]+d[i]-Math.sign(s.errors[i])*Math.min(Math.abs(s.errors[i]),c);if(q.errors[i]!==expected||Math.abs(q.commands[i])>c||wrap(q.layers[i].angle+q.layers[i+3].angle)!==wrap(expected))throw Error("recurrence");pairs++;}if(q.layers.some(l=>l.angle<0||l.angle>=TURN))throw Error("wrap");ticks++;return q;}
 for(const x of [0,1000,1025,10000,TURN-1])for(const magnitude of [1,1025,1026,4100,10000])for(const sign of [-1,1]){let s=homeInitial();const d=[sign*magnitude,-sign*magnitude,sign*magnitude];s=advance(s,x,d);if(s.errors.some((e,i)=>e!==d[i]))throw Error("delay");const n=Math.ceil(magnitude/CAP);for(let j=1;j<=n;j++){s=advance(s,x,[0,0,0]);if(j<n&&s.errors.every(e=>e===0))throw Error("early");}if(s.errors.some(Boolean))throw Error("recovery");impulses++;}
 for(const d of [512,1025,2050,4100]){let s=homeInitial();for(let j=0;j<32;j++)s=advance(s,1000,[d,-d,d]);const expected=d+31*Math.max(0,d-CAP);if(s.errors[0]!==expected)throw Error("persistent");if(d>CAP)overloads++;for(let j=0;j<Math.ceil(expected/CAP);j++)s=advance(s,1000,[0,0,0]);if(s.errors.some(Boolean))throw Error("drain");}
 let s=homeInitial();for(let j=0;j<16;j++){s=advance(s,1000,j===2?[4100,0,0]:[0,0,0]);sample.push({tick:s.tick,errors:s.errors,commands:s.commands,dist:s.dist,layers:s.layers});}
 for(let i=0;i<42;i++){const v=1n<<BigInt(i);if(pack(...unpack(v))!==v)throw Error("payload");bitChecks++;}
 return {ticks,pairs,impulses,overloads,bitChecks,sample};}

const el=id=>document.getElementById(id),c=el("view"),ctx=c.getContext("2d"),colors=["#38bdf8","#fb923c","#b18bff"];let s=homeInitial(),running=true,last=0,v=(1n<<42n)-1n,pending=0,hold=false;const tests=verify(),read=id=>Math.round(Number(el(id).value)*1000);
const advance=()=>{s=homeStep(s,read("x"),[pending+(hold?read("d"):0),0,0],read("cap"));pending=0;ui();};
function ui(){el("out").textContent=["TICK "+s.tick,"x / disturbance / cap "+[read("x"),read("d"),read("cap")].map(n=>(n/1000).toFixed(3)).join(" / ")+"″",...s.errors.map((e,i)=>FRAME[i].name+" error "+(e/1000).toFixed(3)+"″ | correction "+((s.commands?.[i]||0)/1000).toFixed(3)+"″"),"ACCUMULATED CORRECTION "+(s.correction/1000).toFixed(3)+"″","VERIFIED "+tests.pairs+" pair recurrences","WORD 0x"+v.toString(16).padStart(11,"0")].join(String.fromCharCode(10));el("bits").innerHTML=Array.from({length:42},(_,i)=>'<button data-i="'+i+'" style="color:'+["#ef4444","#3b82f6","#10b981","#ccc","#b18bff","#fb923c"][i<24?Math.floor(i/8):i<33?3:i===33?4:5]+'">'+((v>>BigInt(i))&1n)+'</button>').join("");}
el("bits").onclick=e=>{if(e.target.dataset.i!==undefined){v^=1n<<BigInt(e.target.dataset.i);ui();}};for(const id of ["x","d","cap"])el(id).oninput=ui;el("hit").onclick=()=>{pending+=read("d");if(!running)advance();};el("hold").onclick=()=>{hold=!hold;el("hold").textContent="Persistent disturbance: "+(hold?"on":"off");};el("play").onclick=()=>{running=!running;el("play").textContent=running?"Pause":"Play";};el("step").onclick=()=>{running=false;el("play").textContent="Play";advance();};el("reset").onclick=()=>{s=homeInitial();pending=0;hold=false;el("hold").textContent="Persistent disturbance: off";ui();};
function frame(t){if(running&&t-last>650){advance();last=t;}const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#070b16";ctx.fillRect(0,0,w,h);const sc=Math.min(w*.44,h*.43),cx=w/2,cy=h*.5;
for(let j=0;j<6;j++){const l=s.layers[j],k=j%3,spin=l.side*k*2*Math.PI/3+l.net/1000*.20;for(let arm=0;arm<4;arm++){ctx.beginPath();for(let n=0;n<=120;n++){const u=n/120,a=spin+l.hand*u*13+arm*Math.PI/2,r=(.025+.95*u)*(1-k*.22),X=cx+sc*r*Math.cos(a),Y=cy+l.side*sc*(u+r*.13*Math.sin(a));if(n===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}ctx.strokeStyle=colors[k];ctx.lineWidth=1.8;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;}}
const error=s.errors.reduce((a,b)=>a+Math.abs(b),0);ctx.strokeStyle=error?"#fb923c":"#39e9ac";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,15+Math.min(35,error/500),0,Math.PI*2);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();ctx.font="13px monospace";ctx.fillText("{{s}}",cx+12,cy);ctx.fillStyle=error?"#fb923c":"#39e9ac";ctx.fillText("PAIR ERROR "+(error/1000).toFixed(3)+"″",20,28);requestAnimationFrame(frame);}ui();requestAnimationFrame(frame);</script></body></html>
