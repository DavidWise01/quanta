name: QG-043 Unseen Game Transfer Tests
on:
  push:
    paths:
      - "language/unseen-game-transfer.mjs"
      - "language/observer-discovery.mjs"
      - "tests/unseen-game-transfer.test.mjs"
      - ".github/workflows/unseen-game-transfer-tests.yml"
  pull_request:
    paths:
      - "language/unseen-game-transfer.mjs"
      - "language/observer-discovery.mjs"
      - "tests/unseen-game-transfer.test.mjs"
      - ".github/workflows/unseen-game-transfer-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/emergent-observer.test.mjs tests/observer-discovery.test.mjs tests/unseen-game-transfer.test.mjs
