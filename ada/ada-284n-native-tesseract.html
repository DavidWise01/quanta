<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADA-284N · Native tesseract</title><style>body{margin:0;background:#f5f1e7;color:#24202c;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}h1{color:#a8420c}section{background:#171422;color:#eee;padding:20px;border:2px solid #ad91ff;border-radius:16px}canvas{width:100%;height:auto}button,input{font:inherit;padding:10px;margin:5px;box-sizing:border-box}input{width:95%}button{background:#ff9455;color:#201726;border:0;border-radius:6px}button:disabled{opacity:.35}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#6531a5}</style><main><h1>ADA-284N · Live native tesseract projection</h1><p>Phase XI · observation only · .dlw</p><section><h2 id="status" role="status">HOLD — verified package required</h2><label>Expected source commit<input id="commit" maxlength="40" autocomplete="off"></label><button id="load">Verify package</button><canvas id="clock" width="680" height="400" aria-label="Native tesseract projection"></canvas><label>Viewing angle <input id="view" type="range" min="0" max="360" value="30"></label><div id="controls"><button data-step="1" disabled>+1</button><button data-step="24" disabled>+24</button><button data-step="360" disabled>+360</button><button id="play" disabled>Play</button><button id="stop" disabled>Stop</button></div><pre id="report">No native observations.</pre></section><p>No JavaScript clock fallback. Browser scheduling is not physical clock calibration.</p><a href="ada-283n-native-clock.html">Previous clock</a> · <a href="https://github.com/DavidWise01/quanta/actions/workflows/ada-package.yml">Packaging CI</a></main><script type="module">
import {loadKernel} from "./wasm/loader.mjs";
const $=id=>document.getElementById(id),ctx=$("clock").getContext("2d"),controls=[...$("controls").querySelectorAll("button")];let kernel=null,generation=null,timer=null;
function stop(){clearInterval(timer);timer=null;}
function hold(msg){stop();kernel=null;generation=null;controls.forEach(b=>b.disabled=true);$("status").textContent="HOLD — "+msg;$("report").textContent="No native observations.";ctx.clearRect(0,0,680,400);}
function render(){const e=kernel.exports;const f=Array.from({length:6},(_,i)=>e.ada_clock_field(generation,i)>>>0);if(f.some(x=>x===4294967295)||f[0]!==generation||f[2]>=24||f[3]>=8||f[4]>=360||f[5]>=3)throw Error("Native clock field rejected");const [g,epoch,slot,memory,tick,sector]=f;const points=Array.from({length:16},(_,v)=>Array.from({length:3},(_,a)=>e.ada_tesseract_coordinate(v,tick,a)));
if(points.flat().some(v=>!Number.isFinite(v)||Math.abs(v)>4))throw Error("Native coordinate rejected");
const edges=Array.from({length:32},(_,i)=>[0,1].map(j=>e.ada_tesseract_edge(i,j)>>>0));
const unique=new Set(),degree=Array(16).fill(0);
for(const [a,b] of edges){if(a>=16||b>=16||a===b)throw Error("Native edge rejected");const key=[Math.min(a,b),Math.max(a,b)].join(":");if(unique.has(key))throw Error("Duplicate edge");unique.add(key);degree[a]++;degree[b]++;}
if(degree.some(d=>d!==4))throw Error("Native topology rejected");
const angle=Number($("view").value)*Math.PI/180;
const screen=points.map(([x,y,z])=>[340+100*(x*Math.cos(angle)-z*Math.sin(angle)),200+100*y]);
ctx.fillStyle="#171422";ctx.fillRect(0,0,680,400);
const colors=["#ff5264","#38f5ac","#479aff","#bf91ff"];ctx.lineWidth=2;
for(const [a,b] of edges){const axis=Math.log2(a^b);if(!Number.isInteger(axis)||axis>3)throw Error("Edge axis rejected");ctx.strokeStyle=colors[axis];ctx.shadowColor=colors[axis];ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(...screen[a]);ctx.lineTo(...screen[b]);ctx.stroke();}
ctx.shadowBlur=0;ctx.fillStyle="#fff";for(const [x,y] of screen){ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();}
ctx.fillStyle="#ff9455";ctx.font="16px monospace";ctx.textAlign="left";ctx.fillText("4D → 3D → 2D · "+tick+"°",16,24);
$("report").textContent=JSON.stringify({generation:g,epoch,slot,memory,tick,sector,vertices:points.length,edges:edges.length,source:kernel.source,sha256:kernel.sha256},null,2);}
$("view").oninput=()=>{if(kernel)try{render()}catch(e){hold(e.message)}};
function advance(n){if(!kernel)return;try{const next=kernel.exports.ada_clock_advance(generation,n)>>>0;if(next===4294967295||next<=generation)throw Error("Native clock advance rejected");generation=next;render()}catch(e){hold(e.message)}}
$("load").onclick=async()=>{hold("verifying");$("load").disabled=true;try{kernel=await loadKernel(new URL("./wasm/package/",location.href),$("commit").value.trim());generation=kernel.exports.ada_clock_field(0,0)>>>0;render();controls.forEach(b=>b.disabled=false);$("status").textContent="READY — compiled Rust geometry"}catch(e){hold(e.message)}finally{$("load").disabled=false}};
document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>advance(Number(b.dataset.step)));$("play").onclick=()=>{if(kernel&&timer===null)timer=setInterval(()=>advance(1),200)};$("stop").onclick=stop;addEventListener("pagehide",stop);hold("verified package required");
</script></html>
