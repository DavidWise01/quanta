name: ADA-324N native equivalence evidence
on:
  push:
    paths:
      - '.github/workflows/ada-native-evidence.yml'
      - 'ada/wasm/src/**'
      - 'ada/rust/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native execution and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustup toolchain install 1.85.1 --profile minimal
          rustc +1.85.1 -Vv > evidence/compiler.txt
          git rev-parse HEAD > evidence/source.txt
          test "$(cat evidence/source.txt)" = "$GITHUB_SHA"
          git hash-object ada/wasm/src/equilibrium.rs > evidence/equilibrium-blob.txt
          for suite in cycle_tests adaptive_period_tests recovery_tests differential_tests recovery_comparison_tests head_commitment_tests canonical_vector_tests; do
            cargo +1.85.1 test --locked --manifest-path ada/wasm/Cargo.toml --lib "$suite" -- --nocapture 2>&1 | tee "evidence/$suite.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "evidence/$suite.log"
          done
          (cd evidence && sha256sum *.txt *.log > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ada-native-equivalence-${{ github.sha }}
          path: evidence/
