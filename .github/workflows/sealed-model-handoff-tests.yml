name: QG-059 Sealed Model Handoff Tests
on:
  push:
    paths:
      - "language/sealed-model-handoff.mjs"
      - "tests/sealed-model-handoff.test.mjs"
      - ".github/workflows/sealed-model-handoff-tests.yml"
  pull_request:
    paths:
      - "language/sealed-model-handoff.mjs"
      - "tests/sealed-model-handoff.test.mjs"
      - ".github/workflows/sealed-model-handoff-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/change-versus-noise.test.mjs tests/sealed-model-handoff.test.mjs
