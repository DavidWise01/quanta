<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION 159D · Double tornado</title><style>*{box-sizing:border-box}body{margin:0;background:#070b16;color:#deefff;font:14px system-ui}header{padding:16px 22px;border-bottom:1px solid #35425a}h1{font-size:20px;margin:0;color:#90ecff;letter-spacing:2px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(285px,1fr)}canvas{width:100%;height:82vh;display:block}aside{padding:18px;border-left:1px solid #35425a}button{background:#18263b;border:1px solid #58bdda;color:#e5fcff;border-radius:6px;padding:9px;margin:4px;cursor:pointer}input{width:100%;accent-color:#5eddf7}pre{white-space:pre-wrap;color:#b4e5ff}#bits{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}#bits button{padding:3px;margin:0}@media(max-width:720px){main{display:block}canvas{height:65vh}}</style></head><body><header><h1>A.I.O.N. 159D / DOUBLE TORNADO</h1>00 11 [ 24 /|\\ 42 ] 11 00 · .dlw</header><main><canvas id="view"></canvas><aside><h2>Shared singlet / six registers</h2><label>Next cycle x (arcseconds): <b id="val"></b><input id="x" type="range" min="0" max="10" step=".025" value="1"></label><button id="play">Pause</button><button id="step">Step</button><button id="reset">Reset</button><pre id="out"></pre><h3>Shared 42-bit payload</h3><div id="bits"></div><small>Equal signed angular increments cancel. Internal angular travel persists. Visual displacement exaggerated.</small></aside></main><script type="module">// ADA-159B .dlw — 42-bit Stargate, three-layer tornado.
export const GATE="00 11 [ 24 /|\\ 42 ] 11 00";
export const WIDTH=42, TURN=1296000000, OFFSET=1025;
export const LAYERS=Object.freeze(["|V| vector","[] voxel","{[()]} vogel"]);
export function pack(s,c,i,w){const a=[s,c,i,w],n=[24,9,1,8];if(a.some((v,j)=>typeof v!=="bigint"||v<0n||v>=1n<<BigInt(n[j])))throw Error("width");return s|(c<<24n)|(i<<33n)|(w<<34n);}
export function unpack(v){if(typeof v!=="bigint"||v<0n||v>=1n<<42n)throw Error("width");return [v&0xffffffn,(v>>24n)&511n,(v>>33n)&1n,(v>>34n)&255n];}


 // ADA-159D .dlw — mirrored, equal-time antistrophic pairs.
export const FRAME=Object.freeze([{name:"vector",hand:1,phase:0},{name:"voxel",hand:-1,phase:2},{name:"vogel",hand:1,phase:4}].map(Object.freeze));
const wrap=a=>((a%TURN)+TURN)%TURN;
export function initial(){return {tick:0,x:null,layers:[1,-1].flatMap(side=>FRAME.map((f,i)=>({...f,side,hand:f.hand*side,angle:wrap(side*i*TURN/3),net:0,push:0,pull:0,travel:0})))};}
export function step(s,x){if(!Number.isSafeInteger(x)||x<0||x>TURN)throw Error("x in milliarcseconds");const latched=s.tick%8===0?x:s.x;
 return {tick:s.tick+1,x:latched,layers:s.layers.map(l=>{const p=(s.tick+l.phase)%8,pull=p>=4,local=pull?-(latched+OFFSET):latched,delta=l.hand*local;
 return {...l,p,delta,angle:wrap(l.angle+delta),net:l.net+delta,push:l.push+Number(!pull),pull:l.pull+Number(pull),travel:l.travel+Math.abs(delta)};})};}
export function check(s){for(let i=0;i<3;i++){const a=s.layers[i],b=s.layers[i+3];if(a.net+b.net!==0||a.delta+b.delta!==0||wrap(a.angle+b.angle)!==0||a.push!==b.push||a.pull!==b.pull||a.travel!==b.travel)throw Error("mirror");}if(s.layers.reduce((v,l)=>v+l.net,0)!==0)throw Error("net");}
export function verify(){let ticks=0,pairs=0,cycles=0,bitChecks=0;for(const x of [0,1,1000,1025,123456,TURN-1,TURN]){let s=initial();for(let n=0;n<80;n++){s=step(s,n%8===0?x:0);check(s);ticks++;pairs+=3;if((n+1)%8===0){const c=(n+1)/8;for(const l of s.layers)if(l.net!==-4100*l.hand*c||l.push!==4*c||l.pull!==4*c||l.travel!==(8*x+4100)*c)throw Error("cycle");cycles++;}}}
 let q=initial();let expected=0;for(let n=0;n<800;n++){const x=(n*7919)%TURN;q=step(q,x);check(q);ticks++;pairs+=3;if(n%8===0)expected+=8*x+4100;if((n+1)%8===0){if(q.layers.some(l=>l.travel!==expected))throw Error("varying x");cycles++;}}
 for(let i=0;i<42;i++){const v=1n<<BigInt(i);if(pack(...unpack(v))!==v)throw Error("payload");bitChecks++;}
 let s=initial();const ledger=[];for(let i=0;i<8;i++){s=step(s,1000);ledger.push(s);}return {ticks,pairs,cycles,bitChecks,cycleNet:s.layers.map(l=>l.net),travel:s.layers.reduce((a,l)=>a+l.travel,0),ledger};}

const el=id=>document.getElementById(id),c=el("view"),ctx=c.getContext("2d"),colors=["#38bdf8","#fb923c","#b18bff"];let s=initial(),running=true,last=0,v=(1n<<42n)-1n;const tests=verify();const advance=()=>{s=step(s,Math.round(Number(el("x").value)*1000));check(s);ui();};
function ui(){el("val").textContent=Number(el("x").value).toFixed(3);el("out").textContent=["TICK "+s.tick,"LATCHED x "+(s.x===null?"unset":s.x/1000)+"″",...s.layers.map(l=>(l.side>0?"A ":"B ")+l.name+"  "+(l.net/1000).toFixed(3)+"″  "+l.push+"/"+l.pull),"NET "+(s.layers.reduce((a,l)=>a+l.net,0)/1000).toFixed(3)+"″","TRAVEL "+(s.layers.reduce((a,l)=>a+l.travel,0)/1000).toFixed(3)+"″","VERIFIED "+tests.ticks+" ticks / "+tests.pairs+" pairs","WORD 0x"+v.toString(16).padStart(11,"0")].join(String.fromCharCode(10));el("bits").innerHTML=Array.from({length:42},(_,i)=>'<button data-i="'+i+'" style="color:'+["#ef4444","#3b82f6","#10b981","#ccc","#b18bff","#fb923c"][i<24?Math.floor(i/8):i<33?3:i===33?4:5]+'">'+((v>>BigInt(i))&1n)+'</button>').join("");}
el("bits").onclick=e=>{if(e.target.dataset.i!==undefined){v^=1n<<BigInt(e.target.dataset.i);ui();}};el("x").oninput=ui;el("play").onclick=()=>{running=!running;el("play").textContent=running?"Pause":"Play";};el("step").onclick=()=>{running=false;el("play").textContent="Play";advance();};el("reset").onclick=()=>{s=initial();ui();};
function frame(t){if(running&&t-last>650){advance();last=t;}const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#070b16";ctx.fillRect(0,0,w,h);const sc=Math.min(w*.44,h*.43),cx=w/2,cy=h*.5;ctx.setLineDash([4,5]);ctx.strokeStyle="#53617a";ctx.beginPath();ctx.moveTo(cx,cy-sc);ctx.lineTo(cx,cy+sc);ctx.stroke();ctx.setLineDash([]);
for(let j=0;j<6;j++){const l=s.layers[j],k=j%3,spin=l.side*k*2*Math.PI/3+l.net/1000*.20;for(let arm=0;arm<4;arm++){ctx.beginPath();for(let n=0;n<=120;n++){const u=n/120,a=spin+l.hand*u*13+arm*Math.PI/2,r=(.025+.95*u)*(1-k*.22),X=cx+sc*r*Math.cos(a),Y=cy+l.side*sc*(u+r*.13*Math.sin(a));if(n===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}ctx.strokeStyle=colors[k];ctx.lineWidth=1.8;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;}}
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();ctx.font="13px monospace";ctx.fillText("{{s}}",cx+12,cy);ctx.fillStyle="#9eeaff";ctx.fillText("SIGNED NET = 0",20,28);requestAnimationFrame(frame);}ui();requestAnimationFrame(frame);</script></body></html>
