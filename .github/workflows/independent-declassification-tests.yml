name: QG-074 Independent Declassification Tests
on:
  push:
    paths:
      - "language/independent-declassification.mjs"
      - "tests/independent-declassification.test.mjs"
      - ".github/workflows/independent-declassification-tests.yml"
  pull_request:
    paths:
      - "language/independent-declassification.mjs"
      - "tests/independent-declassification.test.mjs"
      - ".github/workflows/independent-declassification-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/provenance-transformation.test.mjs tests/independent-declassification.test.mjs
