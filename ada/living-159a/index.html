<!doctype html><meta charset=utf-8><title>ADA-159A Stargate</title><style>body{background:#09121c;color:#ecf5ff;font:16px monospace;padding:24px}main{display:flex;flex-wrap:wrap;gap:6px}span{padding:8px;border:1px solid #64748b;border-radius:4px}</style><h1>A.I.O.N. 159A · 42-bit Stargate</h1><pre>00 11 [ 24 /|\ 42 ] 11 00</pre><main id="bits"></main><p id="result"></p><script type=module>// ADA-159A .dlw — proposed lossless structural packing; not a physical quantum model.
export function pack(spectrum,chrome,singlet,coordinates){
 const fields=[spectrum,chrome,singlet,coordinates], widths=[24,9,1,8];
 if(fields.some((v,i)=>typeof v!=="bigint"||v<0n||v>=(1n<<BigInt(widths[i]))))throw Error("field width");
 return spectrum|(chrome<<24n)|(singlet<<33n)|(coordinates<<34n);
}
export function unpack(v){if(typeof v!=="bigint"||v<0n||v>=1n<<42n)throw Error("width");return [v&0xffffffn,(v>>24n)&511n,(v>>33n)&1n,(v>>34n)&255n];}
export function verify(){let n=0;for(let i=0;i<42;i++){const v=1n<<BigInt(i);if(pack(...unpack(v))!==v)throw Error("basis");n++;}for(const v of [0n,(1n<<42n)-1n]){if(pack(...unpack(v))!==v)throw Error("edge");n++;}let x=1n;for(let i=0;i<4096;i++){x=(x*25214903917n+11n)&((1n<<42n)-1n);if(pack(...unpack(x))!==x)throw Error("roundtrip");n++;}return n;}

let v=0n;const draw=()=>{document.getElementById("bits").innerHTML=Array.from({length:42},(_,i)=>'<span style="cursor:pointer;color:'+['#ef4444','#3b82f6','#10b981','#c0c0c0','#a78bfa','#ee962b'][i<24?Math.floor(i/8):i<33?3:i===33?4:5]+'" data-i="'+i+'">'+((v>>BigInt(i))&1n)+'</span>').join("");document.getElementById("result").textContent="42-bit word: "+v.toString(16)+" | round trips: "+verify();};document.getElementById("bits").onclick=e=>{if(e.target.dataset.i!==undefined){v^=1n<<BigInt(e.target.dataset.i);draw();}};draw();</script>
