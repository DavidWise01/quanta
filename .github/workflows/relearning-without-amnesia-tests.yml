name: QG-061 Relearning Without Amnesia Tests
on:
  push:
    paths:
      - "language/relearning-without-amnesia.mjs"
      - "tests/relearning-without-amnesia.test.mjs"
      - ".github/workflows/relearning-without-amnesia-tests.yml"
  pull_request:
    paths:
      - "language/relearning-without-amnesia.mjs"
      - "tests/relearning-without-amnesia.test.mjs"
      - ".github/workflows/relearning-without-amnesia-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/right-to-be-wrong.test.mjs tests/relearning-without-amnesia.test.mjs
