name: QG-073 Provenance Transformation Tests
on:
  push:
    paths:
      - "language/provenance-transformation.mjs"
      - "tests/provenance-transformation.test.mjs"
      - ".github/workflows/provenance-transformation-tests.yml"
  pull_request:
    paths:
      - "language/provenance-transformation.mjs"
      - "tests/provenance-transformation.test.mjs"
      - ".github/workflows/provenance-transformation-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/hive-scoped-authority.test.mjs tests/provenance-transformation.test.mjs
