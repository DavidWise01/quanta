<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADA 159P — Chromium Eye</title><style>*{box-sizing:border-box}body{margin:0;background:#05070d;color:#e1edff;font:14px system-ui}header{padding:16px 24px;border-bottom:1px solid #526277;background:linear-gradient(110deg,#111722,#293a50,#111722)}h1{margin:0;font-size:20px;letter-spacing:.22em}small{color:#a1b5cc}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:85vh}section{position:relative;min-height:500px}canvas{width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}aside{padding:20px;border-left:1px solid #495b73;background:linear-gradient(135deg,#111b2b,#090d16)}h2{font-size:11px;letter-spacing:.2em;color:#9bbbd1;margin-top:24px}button{background:linear-gradient(#40516b,#131c2a 50%,#263c50);border:1px solid #91acc4;color:#fff;padding:10px;border-radius:4px;margin:3px;cursor:pointer}input[type=range]{width:100%;accent-color:#70faff}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#afd9ed;font-size:11px}.hud{position:absolute;left:18px;top:20px;color:#9bfaff;pointer-events:none;font:11px monospace;letter-spacing:.12em}.foot{position:absolute;bottom:18px;left:18px;color:#a1b5cc;pointer-events:none;font:11px monospace}.gram{color:#eafaff;letter-spacing:.06em;font:12px monospace}.dot{font-size:24px;color:#fff;text-shadow:0 0 18px #9efaff}@media(max-width:750px){main{display:block}section{height:65vh;min-height:320px}}</style></head><body><header><h1>CHROMIUM / EYE .dlw</h1><small>ADA 159P · 42-BIT DOT-FIRST FIELD</small></header><main><section><canvas id="view"></canvas><div class="hud">RBG • MIRRORED FIELD / LIVE 3D</div><div class="foot">DRAG TO ORBIT · WHEEL TO ZOOM · FIXED DOT · CHROME + NEON</div></section><aside><h2>CANONICAL FREEZE</h2><pre id="grammar" class="gram"></pre><div class="dot">◉ 0 / 0 / 0</div><h2>SPECTRAL CHANNELS</h2><div id="bands"></div><h2>CHROMIUM CONTROLS</h2><label>Chaos<input id="chaos" type=range min=0 max=1 step=.01 value=.65></label><label>Neon intensity<input id="neon" type=range min=0 max=1 step=.01 value=.75></label><label>Speed<input id="speed" type=range min=0 max=2 step=.01 value=.65></label><label><input id="chrome" type=checkbox checked> Chrome rings</label><label><input id="mobius" type=checkbox checked> Möbius return</label><button id="play">Pause</button><button id="reset">Reset view</button><button id="top">Eye view</button><h2>VERIFICATION</h2><pre id="report"></pre><small>Symbolic quantum-dot geometry; not a quantum or fluid solver.</small></aside></main><script type=module>// ADA-159N .dlw — Eye of the Observer, parametric 3D toroidal tornado
export const CANONICAL=String.raw`{outerbound,brace\tornado[innerbound(chaos/tornado)]}`;
export const EYE=Object.freeze([0,0,0]);
export const BANDS=Object.freeze([{name:"Vogel",space:"state space",coords:"vwxyz",code:"r8!",color:"#ff4565",tube:.89,hand:1},{name:"Voxel",space:"operant space",coords:"wxyz",code:"b8!",color:"#399dff",tube:.65,hand:-1},{name:"Vector",space:"operants",coords:"xy:`z`",code:"g8!",color:"#35ffa3",tube:.40,hand:1}].map(Object.freeze));
export const TAU=2*Math.PI;
export function point(u,v,k,t=0,chaos=.5){const b=BANDS[k],a=b.tube*(1+.08*chaos*Math.sin(3*u+2*v+t)),r=1.65+a*Math.cos(v),theta=u+b.hand*.42*Math.sin(v)+.11*chaos*Math.sin(3*v+2*u+t),y=2.1*a*Math.sin(v);return [r*Math.cos(theta),y,r*Math.sin(theta)];}
export function streamline(q,arm,k,t=0,chaos=.5){const b=BANDS[k];return point(b.hand*3*q+arm*TAU/4+t*b.hand,2*q+arm*TAU/4+t*.36,k,t,chaos);}
export function verify(){let samples=0,min=Infinity,closure=0;for(const t of [0,1,5,13])for(const a of [0,.5,1])for(let k=0;k<3;k++)for(let j=0;j<128;j++){const q=j*TAU/128,p=streamline(q,j%4,k,t,a),p2=streamline(q+TAU,j%4,k,t,a),r=Math.hypot(p[0],p[2]);min=Math.min(min,r);closure=Math.max(closure,Math.hypot(...p.map((v,i)=>v-p2[i])));if(!p.every(Number.isFinite)||r<.68||r>2.62||Math.abs(p[1])>2.03)throw Error("bound");samples++;}if(closure>1e-10||EYE.some(Boolean))throw Error("eye/closure");return {samples,minEyeClearance:min,maxClosureError:closure,eye:EYE,streams:12,width:42};}

 // ADA-159O .dlw — nonorientable return ribbon, fixed observer.
export const HALF_WIDTH=.24, RETURN_RADIUS=1.65;
export function ribbon(u,s,t=0,chaos=.5){const theta=u+t*.32,tw=u/2,mid=RETURN_RADIUS+.07*chaos*Math.sin(3*u+t),r=mid+s*Math.cos(tw);return [r*Math.cos(theta),.32*Math.sin(2*u+t)*chaos+s*Math.sin(tw),r*Math.sin(theta)];}
export function returnPath(q,t=0,chaos=.5){return ribbon(q,HALF_WIDTH*.86,t,chaos);}
const distance=(a,b)=>Math.hypot(...a.map((v,k)=>v-b[k]));
export function verifyReturn(){const original=verify();let samples=0,swapError=0,doubleError=0,minClearance=Infinity,minOneLap=Infinity,maxCenterError=0;for(const t of [0,1,5,13])for(const a of [0,.5,1])for(let j=0;j<128;j++){const u=j*TAU/128;for(const s of [-HALF_WIDTH,-.12,0,.12,HALF_WIDTH]){const p=ribbon(u,s,t,a);swapError=Math.max(swapError,distance(ribbon(u+TAU,s,t,a),ribbon(u,-s,t,a)));doubleError=Math.max(doubleError,distance(ribbon(u+2*TAU,s,t,a),p));minClearance=Math.min(minClearance,Math.hypot(p[0],p[2]));if(!p.every(Number.isFinite))throw Error("nonfinite");samples++;}minOneLap=Math.min(minOneLap,distance(returnPath(u+TAU,t,a),returnPath(u,t,a)));maxCenterError=Math.max(maxCenterError,distance(ribbon(u+TAU,0,t,a),ribbon(u,0,t,a)));}if(swapError>1e-10||doubleError>1e-10||minClearance<1.33||minOneLap<.4||EYE.some(Boolean))throw Error("return invariant");return {original,samples,swapError,doubleError,minClearance,minOneLap,maxCenterError,eye:EYE,halfTwists:1,edgeLaps:2};}

 // ADA-159P .dlw — dot-first frozen grammar; mirrored channels.
export const DOT_GRAMMAR=String.raw`\r8!\b8!\g8! | . | /g8!/b8!/r8!`;
export const DOT_RADIUS=.14;
export const CHANNELS=Object.freeze([0,1,2].map(k=>Object.freeze({band:k,ingress:true})).concat([2,1,0].map(k=>Object.freeze({band:k,ingress:false}))));
export function channel(q,k,side,t=0){const p=streamline(q,0,k,t,.5);return side===1?p:p.map(v=>-v);}
export function verifyDot(){const inherited=verifyReturn();let samples=0,maxMirror=0,min=Infinity;for(const t of [0,1,5,13])for(let k=0;k<3;k++)for(let j=0;j<256;j++){const p=channel(j*TAU/256,k,1,t),m=channel(j*TAU/256,k,-1,t);maxMirror=Math.max(maxMirror,Math.hypot(...p.map((v,i)=>v+m[i])));min=Math.min(min,Math.hypot(...p)-DOT_RADIUS);samples++;}if(maxMirror!==0||min<=0||EYE.some(Boolean)||CHANNELS.map(c=>c.band).join()!=="0,1,2,2,1,0")throw Error("dot");return {inherited,samples,maxMirror,minSurfaceClearance:min,eye:EYE,width:42,channelOrder:CHANNELS.map(c=>BANDS[c.band].code)};}

const el=id=>document.getElementById(id),c=el("view"),ctx=c.getContext("2d");el("grammar").textContent=DOT_GRAMMAR;const report=verifyDot();el("report").textContent=["Inherited samples "+(report.inherited.original.samples+report.inherited.samples),"Mirror samples "+report.samples,"Mirror error "+report.maxMirror,"Eye fixed "+report.eye.join(",")].join(String.fromCharCode(10));el("bands").innerHTML=BANDS.map((b,k)=>'<label style="color:'+b.color+'"><input id="b'+k+'" type=checkbox checked> '+b.name+' / '+b.code+'</label>').join("");
let yaw=.35,pitch=.48,zoom=1,t=0,last=0,pause=false,drag=null;c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.57,Math.min(1.57,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]}};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2,zoom*Math.exp(-e.deltaY*.001)))};el("play").onclick=()=>{pause=!pause;el("play").textContent=pause?"Play":"Pause"};el("top").onclick=()=>{pitch=1.55;yaw=0};el("reset").onclick=()=>{pitch=.48;yaw=.35;zoom=1};
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!pause)t+=dt*+el("speed").value;const chaos=+el("chaos").value,neon=+el("neon").value,w=c.clientWidth,h=c.clientHeight,d=Math.min(2,devicePixelRatio||1);if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.65);bg.addColorStop(0,"#1b2b40");bg.addColorStop(.46,"#0b1423");bg.addColorStop(1,"#020409");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const sc=Math.min(w,h)*.173*zoom,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
function project(p){const X=p[0]*cy-p[2]*sy,Z=p[0]*sy+p[2]*cy,Y=p[1]*cp-Z*sp,D=p[1]*sp+Z*cp,f=8/(8-D);return [w/2+X*sc*f,h/2-Y*sc*f,D]}
const lines=[];function curve(fn,n,col,alpha,width,metal=false){let a=project(fn(0));for(let i=1;i<=n;i++){const b=project(fn(i/n*TAU));lines.push({a,b,z:(a[2]+b[2])/2,col,alpha,width,metal,i,n});a=b}}
for(let k=0;k<3;k++){if(!el("b"+k).checked)continue;const b=BANDS[k];for(let j=0;j<10;j++)curve(u=>point(u,j*TAU/10,k,t,chaos),90,b.color,.15,.75);for(let j=0;j<4;j++){curve(q=>streamline(q,j,k,t,chaos),180,b.color,.85,2);curve(q=>streamline(q,j,k,t,chaos).map(v=>-v),180,b.color,.45,1.2)}}
if(el("chrome").checked){for(let k=0;k<3;k++)for(let j=0;j<2;j++)curve(u=>{const r=1.65+BANDS[k].tube*(j?1:-1);return [r*Math.cos(u),0,r*Math.sin(u)]},180,"#b8cbdf",1,4,true);for(let j=0;j<3;j++)curve(u=>{const a=j*TAU/3;return [2.65*Math.cos(u)*Math.cos(a),2.0*Math.sin(u),2.65*Math.cos(u)*Math.sin(a)]},180,"#b8cbdf",.7,2,true)}
if(el("mobius").checked){for(let j=0;j<=12;j++)curve(u=>ribbon(u,(j/6-1)*HALF_WIDTH,t,chaos),144,"#ffe6a0",.3,.8);curve(u=>ribbon(2*u,HALF_WIDTH,t,chaos),300,"#fff1be",.95,2.5,true)}
lines.sort((a,b)=>a.z-b.z);for(const l of lines){ctx.globalAlpha=l.alpha*(.6+.4*(l.z+3)/6);ctx.strokeStyle=l.col;ctx.lineWidth=l.width;if(l.metal){const v=.5+.5*Math.sin(l.i/l.n*TAU*5+yaw);const g=Math.round(55+200*v);ctx.strokeStyle="rgb("+g+","+Math.min(255,g+13)+","+Math.min(255,g+23)+")";}else if(l.width>1.8){ctx.shadowColor=l.col;ctx.shadowBlur=neon*8}ctx.beginPath();ctx.moveTo(l.a[0],l.a[1]);ctx.lineTo(l.b[0],l.b[1]);ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1;
const e=project(EYE),r=Math.max(9,sc*DOT_RADIUS);const halo=ctx.createRadialGradient(e[0],e[1],r*.3,e[0],e[1],r*4);halo.addColorStop(0,"#eaffff");halo.addColorStop(.2,"#6afcff88");halo.addColorStop(1,"#00ffff00");ctx.fillStyle=halo;ctx.fillRect(e[0]-r*4,e[1]-r*4,r*8,r*8);const chrome=ctx.createLinearGradient(e[0]-r,e[1]-r,e[0]+r,e[1]+r);for(const [v,col] of [[0,"#fff"],[.2,"#a9d8ff"],[.42,"#25384b"],[.5,"#f9ffff"],[.65,"#57788f"],[1,"#101c2a"]])chrome.addColorStop(v,col);ctx.fillStyle=chrome;ctx.beginPath();ctx.arc(e[0],e[1],r,0,TAU);ctx.fill();ctx.strokeStyle="#dbffff";ctx.lineWidth=1;ctx.stroke();ctx.font="11px monospace";ctx.fillStyle="#efffff";ctx.fillText("| . |",e[0]+r+9,e[1]-r);requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
