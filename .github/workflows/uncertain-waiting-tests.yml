name: QG-056 Uncertain Waiting Tests
on:
  push:
    paths:
      - "language/uncertain-waiting.mjs"
      - "tests/uncertain-waiting.test.mjs"
      - ".github/workflows/uncertain-waiting-tests.yml"
  pull_request:
    paths:
      - "language/uncertain-waiting.mjs"
      - "tests/uncertain-waiting.test.mjs"
      - ".github/workflows/uncertain-waiting-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/value-of-waiting.test.mjs tests/uncertain-waiting.test.mjs
