name: ADA-199N Browser Runtime Verification
on:
  push:
    branches: [main]
    paths:
      - 'ada/**'
      - '.github/workflows/ada-199n-browser-verification.yml'
  workflow_dispatch:
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned laboratory source integrity
        run: node ada/ada-199n-source-integrity-test.mjs
      - name: Verify eight simulation cores and replay invariants
        run: node ada/ada-199n-eight-lab-core-test.mjs
      - name: Test seeded engine and deterministic replay
        run: node ada/ada-199n-deterministic-engine-test.mjs
      - name: Check WebGL1 WebGL2 and Canvas2D context detection
        run: node ada/ada-199n-renderer-probe-test.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve Pages source over HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ada199-server.log 2>&1 &
          echo $! > /tmp/ada199-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ada/ada-198n-3d-stress-recovery.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ada199-server.log
          exit 1
      - name: Run local WebGL Chromium verification
        id: local
        continue-on-error: true
        env:
          ADA_BASE_URL: http://127.0.0.1:8765
          ADA_REPORT_DIR: ada/verification-results/local
          ADA_REQUIRE_WEBGL: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Verify forced Canvas2D fallback in Chromium
        id: fallback
        if: always()
        continue-on-error: true
        env:
          ADA_BASE_URL: http://127.0.0.1:8765
          ADA_REPORT_DIR: ada/verification-results/fallback
          ADA_FORCE_CANVAS: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Verify public Pages with Chromium
        id: public
        if: always()
        continue-on-error: true
        env:
          ADA_BASE_URL: https://davidwise01.github.io/quanta
          ADA_REPORT_DIR: ada/verification-results/public
          ADA_REQUIRE_WEBGL: "1"
        run: node ada/ada-199n-browser-smoke.mjs
      - name: Upload browser evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-199n-browser-evidence
          path: ada/verification-results/
          if-no-files-found: warn
      - name: Strict final verification gate
        if: always()
        env:
          LOCAL: ${{ steps.local.outcome }}
          FALLBACK: ${{ steps.fallback.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
        run: |
          mkdir -p ada/verification-results
          node -e 'const fs=require("fs"); const keys=["LOCAL","FALLBACK","PUBLIC"]; const outcomes=Object.fromEntries(keys.map(k=>[k,process.env[k]||"not_run"])); const passed=keys.every(k=>outcomes[k]==="success"); fs.writeFileSync("ada/verification-results/gate.json",JSON.stringify({schema:"ADA-199N.gate.v1",passed,outcomes},null,2)+"\n"); console.log("Aggregate browser gate:",JSON.stringify({passed,outcomes})); if(!passed)process.exitCode=1'
      - name: Upload final gate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-199n-final-gate
          path: ada/verification-results/gate.json
          if-no-files-found: warn
