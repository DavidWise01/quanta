<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ADA-118 PB208</title><style>body{background:#09121c;color:#d9eeed;font:15px monospace;max-width:1000px;margin:30px auto;padding:16px}h1{color:#ffc07a}#grid{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:2px}#grid span{background:#18343d;text-align:center;padding:7px 0;font-size:clamp(8px,1.3vw,13px)}#grid .active{background:#ffbe70;color:#09121c}button,select{padding:9px;font:inherit}pre{background:#122732;padding:12px;color:#81e8cf}a{color:#81e8cf}</style><h1>ADA-118 · PB208</h1><p>One Hegemon · 8 modes × 26 symbols · .dlw</p><pre>{brace,abc[box,bca(torroid,cab)]}</pre><div id="grid"></div><p><button id="advance">Exchange +1 tick</button> <button id="reverse">Opposite mode +1 tick</button> <select id="mode"></select> <button id="change">Select mode +1 tick</button></p><pre id="status"></pre><p>Finite symbolic model. Opposite modes invert spatial displacement, not temporal ancestry. The singlet is a reconciliation rule, not a 209th address. Not physical Pb-208 or the QCD gluon algebra.</p><a href="../living-117b/">ADA-117B</a><script type="module">// ADA-118 .dlw — finite symbolic PB substrate, not a nuclear model.
export const N=26, MODES=8;
// Eight reversible directions on Z26; opposite modes paired.
export const shifts=[1,-1,3,-3,5,-5,7,-7];
export function encode(m,p){if(!Number.isInteger(m)||m<0||m>=8||!Number.isInteger(p)||p<0||p>=26)throw Error("range");return 26*m+p;}
export function decode(a){if(!Number.isInteger(a)||a<0||a>=208)throw Error("range");return [Math.floor(a/26),a%26];}
export function step(a){const [m,p]=decode(a);return encode(m,(p+shifts[m]+26)%26);}
export function opposite(a){const [m,p]=decode(a);return encode(m^1,p);}
export function switchMode(a,m){return encode(m,decode(a)[1]);}
export function phase(t){t=BigInt(t);if(t<0n)throw Error("negative");return ["abc","bca","cab"][Number(t%1296000n/432000n)];}
export function test(){let addresses=0,inverse=0,cycles=0;const periods=[];for(let a=0;a<208;a++){if(encode(...decode(a))!==a)throw Error("address");addresses++;if(opposite(step(opposite(step(a))))!==a)throw Error("inverse");inverse++;}for(let m=0;m<8;m++){let a=encode(m,0),b=step(a),k=1;while(b!==a&&k<=26){b=step(b);k++;}if(k!==26)throw Error("cycle");periods.push(k);cycles++;}const seen=new Set([0]),q=[0];for(let i=0;i<q.length;i++){let a=q[i];for(const b of [step(a),...Array.from({length:8},(_,m)=>switchMode(a,m))])if(!seen.has(b)){seen.add(b);q.push(b);}}if(seen.size!==208)throw Error("reachability");const clockTests=[0n,431999n,432000n,863999n,864000n,1295999n,1296000n].map(t=>({tick:String(t),phase:phase(t)}));return {addresses,inverse,cycles,periods,reachable:seen.size,clockTests};}

let a=0,t=0n;const el=id=>document.getElementById(id);for(let m=0;m<8;m++){const o=document.createElement("option");o.value=m;o.textContent="Mode "+m+" ("+shifts[m]+")";el("mode").append(o);}function draw(){el("grid").replaceChildren(...Array.from({length:208},(_,i)=>{const s=document.createElement("span");s.textContent=String.fromCharCode(65+i%26);if(i===a)s.className="active";return s;}));const [m,p]=decode(a);el("status").textContent="Address "+a+" | mode "+m+" | symbol "+String.fromCharCode(65+p)+"\nAbsolute arcseconds "+t+" | orientation "+phase(t);}el("advance").onclick=()=>{a=step(a);t++;draw()};el("reverse").onclick=()=>{a=opposite(a);t++;draw()};el("change").onclick=()=>{a=switchMode(a,Number(el("mode").value));t++;draw()};draw();</script></html>
